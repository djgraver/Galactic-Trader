<div id="frame">
<div id="app">
  <header id="bar">
    <div class="logo">GALACTIC TRADER</div>
    <div class="where" id="where"></div>
    <div class="ibs">
      <button class="ib" data-act="ship" data-label="Your captain and your ship">SHIP</button>
      <button class="ib" data-act="quests" data-label="Your quests: the Ninth Lane, contracts and guild notices">QUESTS</button>
      <button class="ib" data-act="planets" data-label="The star map: every world, what it buys and what it makes">PLANETS</button>
      <button class="ib" data-act="log" data-label="Read the flight log">LOG</button>
      <button class="ib" id="bSound" data-act="sound" data-label="Sound on or off">SOUND</button>
      <button class="ib" data-act="new" data-label="Quit this voyage or start a new game">NEW/QUIT</button>
      <button class="ib help" data-act="info" data-label="How to play">HELP</button>
    </div>
  </header>
  <div class="turnbar" id="turnbar" hidden></div>
  <main id="stage"></main>
  <footer id="hud"><div id="sentence" aria-live="polite"></div><div class="stats" id="stats"></div></footer>
</div>
<div class="screen" id="start" hidden></div>
<div class="screen" id="pass" hidden></div>
<div class="flight" id="flight" hidden></div>
<div class="mg" id="mg" hidden></div>
<div class="modal" id="modal" hidden></div>
<div class="toast" id="toast" hidden role="status"></div>
</div>
