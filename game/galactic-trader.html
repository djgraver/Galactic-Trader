<title>Galactic Trader</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@700;800&display=swap">
<style>
/* Layout: a slim top bar, then four columns that are each exactly a quarter of the window (ship | planet | map | log).
   Below 1000px they become tabs, because a quarter of a phone is too narrow to read. Both themes are space-like: deep indigo and pale nebula. */
:root {
  --bg: #eef1fb; --panel: #ffffff; --panel2: #e5eaf8; --line: #c6cee9; --fg: #141a3a; --dim: #5b6592;
  --accent: #0a7ea4; --accent-fg: #ffffff; --amber: #b25a00; --good: #0f8a5f; --bad: #c42b45; --warn: #9a6b00;
  --grey: #d5d9e8; --greytext: #8b93b4; --glow: rgba(10, 126, 164, .12);
  --display: 'Unbounded', 'Arial Black', Impact, sans-serif; --ui: 'Chakra Petch', 'Segoe UI', system-ui, sans-serif; --mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #070914; --panel: #0d1124; --panel2: #141b38; --line: #242d58; --fg: #e6e9ff; --dim: #8d96c8;
  --accent: #6fe7ff; --accent-fg: #04101a; --amber: #ffb347; --good: #3ddc97; --bad: #ff6b7d; --warn: #ffd166;
  --grey: #1b2142; --greytext: #5a6391; --glow: rgba(111, 231, 255, .12); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #070914; --panel: #0d1124; --panel2: #141b38; --line: #242d58; --fg: #e6e9ff; --dim: #8d96c8;
  --accent: #6fe7ff; --accent-fg: #04101a; --amber: #ffb347; --good: #3ddc97; --bad: #ff6b7d; --warn: #ffd166;
  --grey: #1b2142; --greytext: #5a6391; --glow: rgba(111, 231, 255, .12); color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 400 13px/1.45 var(--ui); overflow: hidden; }
button, input { font: inherit; color: inherit; }
b { font-weight: 600; }
#app { height: 100%; display: flex; flex-direction: column; background: radial-gradient(1200px 500px at 20% -10%, var(--glow), transparent 70%), var(--bg); }

.top { flex: none; height: 40px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); background: var(--panel); }
.brand { font: 800 13px var(--display); letter-spacing: .14em; white-space: nowrap; }
.topstat { color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.topbtns { display: flex; gap: 6px; }
.tbtn { height: 26px; min-width: 26px; padding: 0 9px; border: 1px solid var(--line); border-radius: 13px; background: transparent; cursor: pointer; font-size: 12px; }
.tbtn:hover { border-color: var(--accent); color: var(--accent); }

.tabs { display: none; flex: none; border-bottom: 1px solid var(--line); background: var(--panel); }
.tab { flex: 1; padding: 9px 4px; border: 0; background: none; color: var(--dim); cursor: pointer; font-weight: 600; border-bottom: 2px solid transparent; }
.tab.on { color: var(--accent); border-bottom-color: var(--accent); }

.cols { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(4, 1fr); }
.col { min-width: 0; overflow-y: auto; padding: 14px 16px 24px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 14px; }
.col:last-child { border-right: 0; }
.col > * { flex: none; }
h3 { margin: 0; font: 700 11px var(--ui); letter-spacing: .16em; text-transform: uppercase; color: var(--dim); }
.sec { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-width: 0; flex-wrap: wrap; }
.dim { color: var(--dim); } .num { font-variant-numeric: tabular-nums; } .good { color: var(--good); } .bad { color: var(--bad); } .warn { color: var(--warn); } .amber { color: var(--amber); }

.btn { height: 28px; padding: 0 12px; border: 1px solid var(--accent); border-radius: 5px; background: var(--accent); color: var(--accent-fg); font-weight: 700; cursor: pointer; white-space: nowrap; }
.btn:hover:not(:disabled) { filter: brightness(1.1); }
.btn.alt { background: transparent; color: var(--accent); }
.btn.go { height: 34px; font: 800 13px var(--display); letter-spacing: .1em; }
.btn:disabled { background: var(--grey); border-color: var(--grey); color: var(--greytext); cursor: not-allowed; }
.btn:focus-visible, .tbtn:focus-visible, .tab:focus-visible, input:focus-visible, .ship:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input[type="number"], input[type="text"] { height: 28px; min-width: 0; border: 1px solid var(--line); border-radius: 5px; background: var(--panel2); padding: 0 6px; }
.qty { width: 56px; text-align: center; }
.val { width: 78px; }

.pname { font: 800 20px var(--display); letter-spacing: .02em; overflow-wrap: anywhere; }
.shipart { background: #04060f; border: 1px solid var(--line); border-radius: 8px; padding: 6px; }
.shipart svg, .planetart canvas, .mapwrap svg { display: block; width: 100%; height: auto; }
.stat { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; }
.bar { grid-column: 1 / -1; height: 5px; border-radius: 3px; background: var(--grey); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
.bar i.f { background: var(--amber); }
.cargo { display: grid; grid-template-columns: 1fr auto auto; gap: 3px 10px; align-items: baseline; }
.big { font: 700 22px var(--ui); font-variant-numeric: tabular-nums; }
.upg { display: grid; grid-template-columns: 1fr auto; gap: 6px 8px; align-items: center; }

.planetart { position: relative; background: #000; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.planetart .tag { position: absolute; left: 10px; bottom: 8px; right: 10px; color: #fff; text-shadow: 0 1px 6px #000; }
.planetart .tag .pname { color: #fff; font-size: 19px; }
.say { font: 400 12px var(--mono); color: #cdd3ff; }
.acts { display: flex; flex-wrap: wrap; gap: 6px; }
.offer { border-color: var(--amber); }
.market { display: flex; flex-direction: column; gap: 6px; }
.mrow { display: grid; grid-template-columns: 1fr auto auto auto; gap: 2px 10px; align-items: center; padding: 7px 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 7px; }
.mrow .nm { font-weight: 700; }
.mrow .ctl { grid-column: 1 / -1; display: flex; gap: 4px; align-items: center; justify-content: space-between; margin-top: 3px; }
.mrow .ctl .btn { padding: 0 8px; flex: 1; }
.mrow .ctl .qty { flex: none; }
.up { color: var(--amber); } .dn { color: var(--accent); } .r { text-align: right; }

.mapwrap { background: #000; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.mapwrap svg text { font-family: var(--ui); }
.mapwrap .pl { cursor: pointer; }
.trip p { margin: 4px 0; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th { text-align: left; font-weight: 600; color: var(--dim); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; padding: 4px 4px; }
td { padding: 5px 4px; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
td.r, th.r { text-align: right; }
tr.me td { color: var(--accent); font-weight: 700; }

.log { display: flex; flex-direction: column; gap: 6px; font-family: var(--mono); font-size: 12px; line-height: 1.5; }
.le { padding: 6px 8px; border-left: 3px solid var(--line); background: var(--panel); border-radius: 0 5px 5px 0; overflow-wrap: anywhere; }
.le.gain { border-left-color: var(--good); color: var(--good); } .le.loss { border-left-color: var(--bad); color: var(--bad); }
.le.event { border-left-color: var(--warn); } .le.info { color: var(--fg); }
.le .tn { color: var(--dim); font-weight: 600; margin-right: 4px; } .le.gain .tn, .le.loss .tn { color: inherit; opacity: .75; }
.le b { font-weight: 700; } .le .fx { opacity: .9; }

.screen { position: fixed; inset: 0; z-index: 20; overflow-y: auto; background: radial-gradient(900px 500px at 70% -10%, rgba(120, 80, 255, .28), transparent 70%), #04050d; color: #e6e9ff; padding: 28px max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px)); }
.screen[hidden], .modal[hidden] { display: none; }
.screen .in { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.title { font: 800 clamp(34px, 8.5vw, 92px)/1 var(--display); letter-spacing: .02em; text-transform: uppercase; background: linear-gradient(100deg, #ffffff 10%, #8be9ff 45%, #b08cff 75%, #ffb347); -webkit-background-clip: text; background-clip: text; color: transparent; text-wrap: balance; }
.tag2 { color: #9aa3da; max-width: 60ch; font-size: 15px; }
.ships { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.ship { text-align: left; background: rgba(20, 27, 56, .75); border: 1px solid #2c3770; border-radius: 10px; padding: 10px; cursor: pointer; color: #e6e9ff; display: flex; flex-direction: column; gap: 6px; }
.ship[aria-pressed="true"] { border-color: #6fe7ff; box-shadow: 0 0 0 2px rgba(111, 231, 255, .35), 0 0 22px rgba(111, 231, 255, .18); }
.ship .sn { font: 800 15px var(--display); }
.ship .sd { color: #9aa3da; font-size: 12px; }
.mini { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 8px; align-items: center; font-size: 11px; color: #9aa3da; }
.mini .bar { grid-column: auto; background: #1b2142; } .mini .bar i { background: #6fe7ff; }
.launch { display: flex; flex-wrap: wrap; align-items: end; gap: 14px; }
.launch label { display: flex; flex-direction: column; gap: 4px; color: #9aa3da; font-size: 12px; }
.launch input { width: 240px; max-width: 100%; height: 40px; background: #0d1124; border: 1px solid #2c3770; color: #fff; font-size: 16px; }
.launch .btn { height: 44px; padding: 0 30px; font: 800 17px var(--display); letter-spacing: .18em; background: #6fe7ff; border-color: #6fe7ff; color: #04101a; }

.modal { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: 16px; background: rgba(2, 3, 12, .72); }
.sheet { width: min(640px, 100%); max-height: 90%; overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.sheet.wide { width: min(780px, 100%); }
.sheet h2 { margin: 0; font: 800 18px var(--display); letter-spacing: .04em; }
.sheet h4 { margin: 8px 0 2px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
.sheet p, .sheet li { margin: 0; } .sheet ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 3px; }
.cols2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 4px 24px; }
.win { color: var(--good); } .lose { color: var(--bad); }
.toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 40; padding: 8px 14px; border-radius: 6px; background: var(--fg); color: var(--bg); font-weight: 600; max-width: 90%; }

@media (max-width: 1000px) {
  .tabs { display: flex; }
  .cols { grid-template-columns: 1fr; }
  .col { display: none; border-right: 0; }
  .col.on { display: flex; }
  .topstat { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
<div id="app">
  <header class="top">
    <div class="brand">Galactic Trader</div>
    <div class="topstat" id="topstat"></div>
    <div class="topbtns">
      <button class="tbtn" data-act="info" aria-label="How to play">?</button>
      <button class="tbtn" id="btnTheme" data-act="theme" aria-label="Switch colour scheme">Theme</button>
      <button class="tbtn" data-act="new">New game</button>
    </div>
  </header>
  <nav class="tabs" aria-label="Panels">
    <button class="tab on" data-act="tab" data-tab="c1">Ship</button>
    <button class="tab" data-act="tab" data-tab="c2">Planet</button>
    <button class="tab" data-act="tab" data-tab="c3">Map</button>
    <button class="tab" data-act="tab" data-tab="c4">Log</button>
  </nav>
  <main class="cols">
    <section class="col on" id="c1" aria-label="Ship and bank"></section>
    <section class="col" id="c2" aria-label="Planet and market"></section>
    <section class="col" id="c3" aria-label="Star map and leaderboard"></section>
    <section class="col" id="c4" aria-label="Flight log"></section>
  </main>
</div>
<div class="screen" id="start" hidden></div>
<div class="modal" id="modal" hidden></div>
<script>
/* Galactic Trader. Part 1: data tables. Parts are concatenated into one script by build.py. */
var GT = {};

GT.CFG = {
  WIN: 150000, START_CREDITS: 2500, START_FUEL_FRAC: 0.8,
  TRAVEL_EVENT: 0.30, EXPLORE: 0.25, ENCOUNTER: 0.30, FACILITY_OFFER: 0.20, COMP_EVENT: 0.20,
  DEPOSIT_RATE: 0.03, LOAN_RATE: 0.05, INTEREST_EVERY: 4, LOAN_STEP: 1000, LOAN_CAP: 10000,
  FUEL_K: 0.5, TOW_COST: 400, DAMAGE_TURNS: 6, FEE_CAP_TURNS: 12, LOG_SHOWN: 60,
  ELASTICITY: 0.35, REVERT: 0.2, UPGRADE_MAX: 6
};

/* depth = typical stock a neutral planet holds; thin markets for pricey goods stop dumping */
GT.ITEMS = [
  { id: 'rations',  name: 'Rations',     base: 24,  depth: 400, vol: 0.035, blurb: 'Vacuum-sealed meals. Everyone eats.' },
  { id: 'metals',   name: 'Metals',      base: 52,  depth: 260, vol: 0.040, blurb: 'Ingots and alloy plate for hulls and habitats.' },
  { id: 'medical',  name: 'Medical',     base: 95,  depth: 160,  vol: 0.045, blurb: 'Meds, grafts and sterile field kits.' },
  { id: 'spices',   name: 'Spices',      base: 160, depth: 100,  vol: 0.060, blurb: 'Flavour worth more than its weight in fuel.' },
  { id: 'circuitry',name: 'Circuitry',   base: 260, depth: 72,  vol: 0.055, blurb: 'Logic cores and gate arrays.' },
  { id: 'darkmatter',name:'Dark Matter', base: 460, depth: 40,  vol: 0.085, blurb: 'Contained in magnetic bottles. Do not shake.' },
  { id: 'artifacts',name: 'Artifacts',   base: 780, depth: 20,  vol: 0.100, blurb: 'Relics of dead empires. Provenance optional.' }
];

/* mult order: rations, metals, medical, spices, circuitry, darkmatter, artifacts. Below 0.8 means the planet produces it. */
GT.PLANETS = [
  { id: 'meridoa', name: 'Meridoa', say: 'meh-RID-oh-ah', type: 'Agrarian', x: 8, y: 38, color: '#7ed957', ring: false,
    tax: 0.03, fuel: 8, fuelSold: false, upgrades: ['cargo'], gambling: false,
    mult: [0.55, 1.25, 0.90, 0.70, 1.35, 1.20, 1.10],
    fac: { broker: 1, depot: 0.5, factory: 1, warehouse: 2, hotel: 1 },
    desc: 'Terraced fields roll to every horizon under a soft green sun. Grain barges outnumber people. Rations and spices are plentiful and cheap, while anything with a circuit in it is treated like magic.' },
  { id: 'karthosu', name: 'Karth-Osu', say: 'KARTH oh-SOO', type: 'Ruin', x: 22, y: 52, color: '#d9a35c', ring: false,
    tax: 0.065, fuel: 9, fuelSold: false, upgrades: [], gambling: false,
    mult: [1.30, 1.20, 1.40, 1.10, 1.30, 1.10, 0.50],
    fac: { broker: 0.5, depot: 0.3, factory: 0.5, warehouse: 1, hotel: 2 },
    desc: 'The bones of a vanished empire, half buried in ochre dust. Diggers sell relics from the tombs at fair prices. They have no clean water, no medicine and no patience for tourists.' },
  { id: 'ferrox', name: 'Ferrox', say: 'FEH-rox', type: 'Mining', x: 30, y: 12, color: '#d9603b', ring: false,
    tax: 0.04, fuel: 8, fuelSold: true, upgrades: ['cargo', 'fuel'], gambling: false,
    mult: [1.35, 0.55, 1.30, 1.20, 1.20, 1.00, 1.00],
    fac: { broker: 0.7, depot: 1.5, factory: 2, warehouse: 1.5, hotel: 0.5 },
    desc: 'A red, pitted rock chewed hollow by a thousand drills. Metals pour out of Ferrox by the megaton and sell for next to nothing. The miners pay well for food and doctors, and Ferrox has a working fuel dock.' },
  { id: 'kryndor', name: 'Kryndor Spire', say: 'KRIN-dor SPYR', type: 'Megacity', x: 50, y: 30, color: '#4fd2ff', ring: false,
    tax: 0.07, fuel: 11, fuelSold: true, upgrades: ['cargo', 'speed', 'fuel'], gambling: false,
    mult: [1.30, 1.10, 1.20, 1.35, 0.85, 1.25, 1.40],
    fac: { broker: 2, depot: 0.7, factory: 0.7, warehouse: 1, hotel: 2 },
    desc: 'One city that covers a whole moon, lit like a jewel box. Circuitry is cheap here. Spices, luxuries and relics sell at silly prices. The tax collectors are everywhere, and so is the best shipyard in the sector.' },
  { id: 'nihil', name: 'Nihil Station', say: 'NY-hill', type: 'Void Station', x: 58, y: 52, color: '#b07cff', ring: false,
    tax: 0.015, fuel: 14, fuelSold: true, upgrades: ['speed'], gambling: true,
    mult: [1.45, 1.20, 1.10, 0.90, 1.00, 0.65, 1.30],
    fac: { broker: 1.5, depot: 1, factory: 0.3, warehouse: 2, hotel: 2 },
    desc: 'A free port hanging in the dark between stars, with almost no tax and almost no questions. Dark matter is cheap here. Hungry crews trade fortunes at the Parlour of Thin Hours, where the games are strange and nobody explains them.' },
  { id: 'quellin', name: 'Quellin Reach', say: 'KWEL-in REECH', type: 'Science', x: 72, y: 14, color: '#ff7ad9', ring: false,
    tax: 0.04, fuel: 10, fuelSold: false, upgrades: ['speed'], gambling: false,
    mult: [1.15, 1.10, 0.60, 1.20, 0.65, 1.35, 1.20],
    fac: { broker: 0.7, depot: 0.7, factory: 1, warehouse: 0.7, hotel: 1 },
    desc: 'White domes and humming labs on a frozen pink moon. Medical supplies and circuitry are made here by the crate. The researchers pay anything for dark matter and for relics to puzzle over.' },
  { id: 'halcyra', name: 'Halcyra', say: 'hal-SY-rah', type: 'Gas Giant', x: 90, y: 38, color: '#ffc24d', ring: true,
    tax: 0.04, fuel: 6, fuelSold: true, upgrades: ['fuel'], gambling: false,
    mult: [1.40, 1.30, 1.25, 1.00, 1.20, 0.55, 1.20],
    fac: { broker: 0.7, depot: 2, factory: 1.5, warehouse: 1, hotel: 0.7 },
    desc: 'A golden ringed giant. Skimmer platforms drift in its upper clouds and bottle dark matter from the storms. Fuel is cheap, but food, metal and medicine all have to be hauled in from far away.' }
];

GT.SHIPS = [
  { id: 'wayfarer', name: 'Wayfarer', cargo: 45, speed: 1.4, fuel: 100, hue: '#4fd2ff',
    desc: 'A sturdy all-rounder with a patched hull and a loyal crew of two. It does nothing brilliantly and nothing badly.' },
  { id: 'gnat', name: 'Gnat', cargo: 28, speed: 2.2, fuel: 85, hue: '#ff7ad9',
    desc: 'Tiny, quick and thrifty with fuel. You can carry a lot of value in a very small hold, if you stay lucky.' },
  { id: 'barge', name: 'Behemoth Barge', cargo: 75, speed: 0.9, fuel: 130, hue: '#ffc24d',
    desc: 'A flying warehouse. It crawls between worlds but hauls more cargo than anything else on the lanes.' },
  { id: 'stargazer', name: 'Stargazer', cargo: 34, speed: 1.6, fuel: 190, hue: '#b07cff',
    desc: 'A long-range survey hull with a huge tank. You can skip the fuel docks and go where the margins are.' },
  { id: 'cutlass', name: 'Cutlass Runner', cargo: 38, speed: 2.0, fuel: 95, hue: '#d9603b',
    desc: 'A smuggler\'s fast hull, with a hold that has some very good false floors. It is quick, quiet and thirsty.' }
];

GT.UPGRADES = {
  cargo: { name: 'Cargo Bay', unit: 'units', step: 8, base: 1200, grow: 1.8, label: '+8 cargo' },
  speed: { name: 'Warp Engine', unit: 'warp', step: 0.2, base: 1400, grow: 1.8, label: '+0.2 warp' },
  fuel:  { name: 'Fuel Tank', unit: 'PC', step: 25, base: 900, grow: 1.7, label: '+25 PC tank (empty)' }
};

/* kind: trade = price edge; fuel = cheaper fuel; fee = income from rivals, collected when you visit */
GT.FACILITIES = [
  { id: 'broker', name: 'Trade Broker', kind: 'trade', pct: 0.015, blurb: 'Better quotes on every trade you make, and a lighter tax bill.' },
  { id: 'depot', name: 'Fuel Depot', kind: 'fuel', pct: 0.06, blurb: 'Cheaper fuel at every refuelling dock you use, and a lighter tax bill.' },
  { id: 'factory', name: 'Factory', kind: 'fee', feePct: 0.0045, blurb: 'Rival traders buy parts here. You collect a fee when you next visit.' },
  { id: 'warehouse', name: 'Warehouse', kind: 'fee', feePct: 0.0040, blurb: 'Rivals rent storage space. Fees pile up until you visit.' },
  { id: 'hotel', name: 'Hotel', kind: 'fee', feePct: 0.0050, blurb: 'Rival crews sleep here. You collect the bills when you visit.' }
];

GT.COMPETITORS = [
  { name: 'Zara Vex', title: 'the Silk-Handed', rate: 0.046 },
  { name: 'Old Brannock', title: 'of the Long Haul', rate: 0.041 },
  { name: 'Captain Ilyx Orro', title: 'the Unlucky', rate: 0.050 },
  { name: 'Mox Tallow', title: 'who Never Blinks', rate: 0.044 }
];

GT.MOODS = [
  'in a foul mood, picking at a ration tin', 'whistling cheerfully and counting coin', 'looking tired and a little desperate',
  'smug, with a fresh stack of credit chits', 'jumpy, glancing at every shadow', 'strangely calm, polishing a boarding hook',
  'half asleep over a cold drink', 'bragging loudly to anyone who will listen'
];

/* Galactic Trader. Part 2: state, markets, tax and trading. No DOM access here. */
(function () {
  var rng = Math.random;
  GT.setRng = function (f) { rng = f; };

  var W = 480, H = 270, dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = W * dpr; cv.height = H * dpr; cv.style.aspectRatio = W + ' / ' + H;
  var c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);
  var seed = 0; for (var i = 0; i < p.id.length; i++) seed = seed * 31 + p.id.charCodeAt(i);
  var rnd = GT.seeded(seed), cx = 300, cy = 126, r = 88, k;
  c.fillStyle = '#000'; c.fillRect(0, 0, W, H);
  for (k = 0; k < 150; k++) { c.globalAlpha = 0.25 + rnd() * 0.75; c.fillStyle = '#fff'; var sz = rnd() < 0.1 ? 1.8 : 1; c.fillRect(rnd() * W, rnd() * H, sz, sz); }
  c.globalAlpha = 1;
  var base = p.color, dark = UI.shade(base, -0.65), lite = UI.shade(base, 0.45);
  function sphere() { var g = c.createRadialGradient(cx - r * 0.4, cy - r * 0.45, r * 0.1, cx, cy, r * 1.05); g.addColorStop(0, lite); g.addColorStop(0.45, base); g.addColorStop(1, dark); c.fillStyle = g; c.beginPath(); c.arc(cx, cy, r, 0, 7); c.fill(); }
  function shadow() { var g = c.createRadialGradient(cx - r * 0.5, cy - r * 0.5, r * 0.5, cx + r * 0.2, cy + r * 0.2, r * 1.25); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,6,.78)'); c.fillStyle = g; c.beginPath(); c.arc(cx, cy, r, 0, 7); c.fill(); }
  function clip() { c.save(); c.beginPath(); c.arc(cx, cy, r, 0, 7); c.clip(); }
  function glow() { var g = c.createRadialGradient(cx, cy, r * 0.95, cx, cy, r * 1.3); g.addColorStop(0, base + '66'); g.addColorStop(1, base + '00'); c.fillStyle = g; c.beginPath(); c.arc(cx, cy, r * 1.3, 0, 7); c.fill(); }
  var t = p.type;
  if (t === 'Void Station') {
    var g = c.createRadialGradient(cx, cy, 8, cx, cy, r * 1.25); g.addColorStop(0, '#000'); g.addColorStop(0.55, '#000'); g.addColorStop(0.75, base + '88'); g.addColorStop(1, base + '00');
    c.fillStyle = g; c.beginPath(); c.arc(cx, cy, r * 1.25, 0, 7); c.fill();
    c.strokeStyle = lite; c.lineWidth = 7; c.beginPath(); c.ellipse(cx, cy, 70, 70, 0, 0, 7); c.stroke();
    c.strokeStyle = base; c.lineWidth = 2;
    for (k = 0; k < 8; k++) { var a = k * Math.PI / 4; c.beginPath(); c.moveTo(cx + Math.cos(a) * 14, cy + Math.sin(a) * 14); c.lineTo(cx + Math.cos(a) * 67, cy + Math.sin(a) * 67); c.stroke(); }
    c.fillStyle = lite; c.beginPath(); c.arc(cx, cy, 15, 0, 7); c.fill(); c.fillStyle = '#000'; c.beginPath(); c.arc(cx, cy, 6, 0, 7); c.fill();
    c.fillStyle = '#fff'; for (k = 0; k < 24; k++) { var b = k * Math.PI / 12; c.fillRect(cx + Math.cos(b) * 70 - 1, cy + Math.sin(b) * 70 - 1, 3, 3); }
    return;
  }
  if (p.ring) { c.save(); c.translate(cx, cy); c.rotate(-0.28); c.strokeStyle = lite; c.globalAlpha = 0.55; c.lineWidth = 16; c.beginPath(); c.ellipse(0, 0, 150, 28, 0, Math.PI, 2 * Math.PI); c.stroke(); c.lineWidth = 6; c.strokeStyle = base; c.beginPath(); c.ellipse(0, 0, 170, 34, 0, Math.PI, 2 * Math.PI); c.stroke(); c.restore(); c.globalAlpha = 1; }
  glow(); sphere(); clip();
  if (t === 'Gas Giant') { for (k = 0; k < 16; k++) { c.fillStyle = k % 2 ? 'rgba(255,240,200,.22)' : 'rgba(150,80,20,.25)'; var yy = cy - r + k * (r * 2 / 16) + rnd() * 4; c.fillRect(cx - r, yy, r * 2, 6 + rnd() * 8); } c.fillStyle = 'rgba(190,60,30,.55)'; c.beginPath(); c.ellipse(cx + 28, cy + 26, 22, 11, 0, 0, 7); c.fill(); }
  else if (t === 'Agrarian') { for (k = 0; k < 90; k++) { c.save(); c.translate(cx + (rnd() - 0.5) * r * 2, cy + (rnd() - 0.5) * r * 2); c.rotate(rnd() < 0.5 ? 0.3 : -0.4); c.fillStyle = rnd() < 0.5 ? 'rgba(255,230,120,.5)' : 'rgba(30,120,50,.5)'; c.fillRect(0, 0, 8 + rnd() * 18, 5 + rnd() * 10); c.restore(); } c.fillStyle = 'rgba(70,150,255,.5)'; c.beginPath(); c.ellipse(cx - 30, cy + 40, 24, 10, 0.4, 0, 7); c.fill(); }
  else if (t === 'Megacity') { for (k = 0; k < 400; k++) { var px = cx + (rnd() - 0.5) * r * 2, py = cy + (rnd() - 0.5) * r * 2; c.fillStyle = rnd() < 0.2 ? '#fff' : base; c.globalAlpha = 0.4 + rnd() * 0.6; c.fillRect(px, py, 1.6, 1.6); } c.globalAlpha = 1; c.strokeStyle = 'rgba(160,240,255,.35)'; c.lineWidth = 1; for (k = -3; k <= 3; k++) { c.beginPath(); c.moveTo(cx - r, cy + k * 24); c.lineTo(cx + r, cy + k * 24); c.stroke(); c.beginPath(); c.moveTo(cx + k * 24, cy - r); c.lineTo(cx + k * 24, cy + r); c.stroke(); } }
  else if (t === 'Mining') { for (k = 0; k < 28; k++) { var qx = cx + (rnd() - 0.5) * r * 1.8, qy = cy + (rnd() - 0.5) * r * 1.8, qr = 3 + rnd() * 12; c.fillStyle = 'rgba(40,10,0,.45)'; c.beginPath(); c.arc(qx, qy, qr, 0, 7); c.fill(); c.strokeStyle = 'rgba(255,170,90,.35)'; c.stroke(); } c.fillStyle = '#ffb347'; for (k = 0; k < 14; k++) c.fillRect(cx + (rnd() - 0.5) * r * 1.6, cy + (rnd() - 0.5) * r * 1.6, 2, 2); }
  else if (t === 'Science') { for (k = 0; k < 9; k++) { var dx = cx + (rnd() - 0.5) * r * 1.5, dy = cy + (rnd() - 0.5) * r * 1.5; c.fillStyle = 'rgba(255,255,255,.75)'; c.beginPath(); c.arc(dx, dy, 6 + rnd() * 6, Math.PI, 2 * Math.PI); c.fill(); c.fillRect(dx - 12, dy, 24, 3); } c.strokeStyle = 'rgba(255,255,255,.35)'; for (k = 0; k < 6; k++) { c.beginPath(); c.moveTo(cx - r, cy - 60 + k * 24 + rnd() * 6); c.quadraticCurveTo(cx, cy - 70 + k * 26, cx + r, cy - 50 + k * 22); c.stroke(); } }
  else if (t === 'Ruin') { for (k = 0; k < 18; k++) { var rx = cx + (rnd() - 0.5) * r * 1.6, ry = cy + (rnd() - 0.5) * r * 1.6; c.strokeStyle = 'rgba(70,40,10,.5)'; c.lineWidth = 2; c.beginPath(); c.arc(rx, ry, 4 + rnd() * 14, 0, 7); c.stroke(); } c.strokeStyle = 'rgba(255,235,190,.7)'; c.lineWidth = 3; c.beginPath(); c.arc(cx - 6, cy + 4, 50, 0.4, 4.2); c.stroke(); c.fillStyle = 'rgba(255,235,190,.8)'; for (k = 0; k < 6; k++) { var aa = 0.4 + k * 0.62; c.fillRect(cx - 6 + Math.cos(aa) * 50 - 2, cy + 4 + Math.sin(aa) * 50 - 6, 4, 12); } }
  c.restore(); shadow();
  if (p.ring) { c.save(); c.translate(cx, cy); c.rotate(-0.28); c.strokeStyle = lite; c.globalAlpha = 0.85; c.lineWidth = 16; c.beginPath(); c.ellipse(0, 0, 150, 28, 0, 0, Math.PI); c.stroke(); c.lineWidth = 6; c.strokeStyle = base; c.beginPath(); c.ellipse(0, 0, 170, 34, 0, 0, Math.PI); c.stroke(); c.restore(); c.globalAlpha = 1; }
};

/* ---------- star map (svg) ---------- */
UI.mapSX = function (x) { return 24 + x * 3.55; };
UI.mapSY = function (y) { return 26 + y * 3.7; };
UI.mapSVG = function (s, dest) {
  var P = GT.PLANETS, out = '<svg viewBox="0 0 400 270" role="group" aria-label="Star map"><rect width="400" height="270" fill="#000"/>', k, rnd = GT.seeded(77);
  for (k = 0; k < 110; k++) out += '<circle cx="' + (rnd() * 400).toFixed(0) + '" cy="' + (rnd() * 270).toFixed(0) + '" r="' + (rnd() < 0.12 ? 1.2 : 0.6) + '" fill="#fff" opacity="' + (0.25 + rnd() * 0.7).toFixed(2) + '"/>';
  if (dest !== null && dest !== s.loc) {
    out += '<line x1="' + UI.mapSX(P[s.loc].x) + '" y1="' + UI.mapSY(P[s.loc].y) + '" x2="' + UI.mapSX(P[dest].x) + '" y2="' + UI.mapSY(P[dest].y) + '" stroke="#ffd166" stroke-width="2" stroke-dasharray="6 5"/>';
  }
  P.forEach(function (p, i) {
    var x = UI.mapSX(p.x), y = UI.mapSY(p.y), here = i === s.loc, sel = i === dest, rad = here ? 11 : 8;
    out += '<g class="pl" data-i="' + i + '" tabindex="0" role="button" aria-label="' + GT.esc(p.name) + (here ? ', current location' : sel ? ', selected destination' : '') + '">';
    out += '<circle cx="' + x + '" cy="' + y + '" r="22" fill="transparent"/>';
    if (p.ring) out += '<ellipse cx="' + x + '" cy="' + y + '" rx="' + (rad + 8) + '" ry="3.4" fill="none" stroke="' + p.color + '" stroke-width="1.6" opacity=".85" transform="rotate(-16 ' + x + ' ' + y + ')"/>';
    if (here) out += '<circle cx="' + x + '" cy="' + y + '" r="' + (rad + 6) + '" fill="none" stroke="#6fe7ff" stroke-width="1.5"/>';
    if (sel) out += '<circle cx="' + x + '" cy="' + y + '" r="' + (rad + 6) + '" fill="none" stroke="#ffd166" stroke-width="2" stroke-dasharray="3 3"/>';
    out += '<circle cx="' + x + '" cy="' + y + '" r="' + rad + '" fill="' + p.color + '"/><circle cx="' + (x - rad * 0.3) + '" cy="' + (y - rad * 0.3) + '" r="' + rad * 0.45 + '" fill="#fff" opacity=".28"/>';
    out += '<text x="' + x + '" y="' + (y + rad + (here || sel ? 21 : 13)) + '" text-anchor="middle" font-size="' + (here ? 14 : 10) + '" font-weight="' + (here ? 800 : 500) + '" fill="' + (here ? '#6fe7ff' : sel ? '#ffd166' : '#c9d0ff') + '">' + GT.esc(p.name) + '</text>';
    s.comps.forEach(function (cp, ci) { if (cp.loc === i) out += '<g><rect x="' + (x + rad + 1 + ci * 7) + '" y="' + (y - rad - 4) + '" width="5" height="5" transform="rotate(45 ' + (x + rad + 3 + ci * 7) + ' ' + (y - rad - 1.5) + ')" fill="#ff7a8c"><title>' + GT.esc(cp.name) + '</title></rect></g>'; });
    out += '</g>';
  });
  return out + '</svg>';
};

/* Galactic Trader. Part 9a: rendering the four columns. */
var S = null;
var ui = { ship: 'wayfarer', name: '', qty: {}, dep: 0, wd: 0, rep: 0, dest: null, more: 0, tab: 'c1', cache: {} };
var $ = function (id) { return document.getElementById(id); };
var esc = GT.esc, fmt = GT.fmt;

function btn(label, act, ok, extra) { return '<button class="btn ' + (extra || '') + '" data-act="' + act + '"' + (ok && !(S && S.over) ? '' : ' disabled') + '>' + label + '</button>'; }
function bar(frac, cls) { return '<span class="bar"><i class="' + (cls || '') + '" style="width:' + Math.round(Math.max(0, Math.min(1, frac)) * 100) + '%"></i></span>'; }
function repLabel(r) { return r >= 75 ? 'Legend' : r >= 40 ? 'Respected' : r >= 10 ? 'Known' : r > -10 ? 'Unknown' : r > -30 ? 'Suspect' : 'Notorious'; }
function qtyOf(i) { return Math.max(1, ui.qty[i] || 1); }

function renderCol1() {
  var sh = GT.SHIPS.filter(function (x) { return x.id === S.shipId; })[0], es = GT.effSpeed(S), used = GT.cargoUsed(S), h = '';
  h += '<div class="sec"><div class="pname">' + esc(S.name) + '</div><div class="dim">Captain of the ' + esc(sh.name) + '</div><div class="shipart">' + UI.shipSVG(sh.id, sh.hue) + '</div></div>';
  h += '<div class="sec"><h3>Ship status</h3><div class="card"><div class="stat">';
  h += '<span>Credits</span><span class="big">' + fmt(S.credits) + 'c</span>';
  h += '<span>Reputation</span><span class="num"><b>' + S.rep + '</b> <span class="dim">' + repLabel(S.rep) + '</span></span>';
  h += '<span>Cargo hold</span><span class="num">' + used + ' / ' + S.ship.cargoMax + '</span>' + bar(used / S.ship.cargoMax);
  h += '<span>Fuel</span><span class="num">' + S.ship.fuel + ' / ' + S.ship.fuelMax + ' PC</span>' + bar(S.ship.fuel / S.ship.fuelMax, 'f');
  h += '<span>Engine speed</span><span class="num">Warp ' + es.toFixed(1) + (es < S.ship.speed ? ' <span class="bad">(damaged, base ' + S.ship.speed.toFixed(1) + ')</span>' : '') + '</span>';
  h += '</div></div></div>';
  h += '<div class="sec"><h3>Cargo hold</h3><div class="card"><div class="cargo"><span class="dim">Item</span><span class="dim r">Units</span><span class="dim r">Avg paid</span>';
  var any = false;
  S.cargo.forEach(function (c, i) { if (c.qty) { any = true; h += '<span>' + GT.ITEMS[i].name + '</span><span class="num">' + c.qty + '</span><span class="num">' + (c.avg ? c.avg.toFixed(1) + 'c' : 'free') + '</span>'; } });
  if (!any) h += '<span class="dim" style="grid-column:1/-1">The hold is empty.</span>';
  h += '</div></div></div>';
  h += '<div class="sec"><h3>Ship upgrades</h3><div class="card upg">';
  ['cargo', 'speed', 'fuel'].forEach(function (k) {
    var u = GT.UPGRADES[k], lv = S.ship.lv[k], avail = GT.upgradeAvail(S, k), maxed = lv >= GT.CFG.UPGRADE_MAX, cost = GT.upgradeCost(S, k);
    var lab = GT.PLANETS[S.loc].upgrades.indexOf(k) < 0 ? 'Not offered here' : maxed ? 'Maxed' : fmt(cost) + 'c';
    h += '<span><b>' + u.name + '</b> <span class="dim">Lv ' + lv + '/' + GT.CFG.UPGRADE_MAX + '</span><br><span class="dim">' + u.label + '</span></span>' + btn(lab, 'up-' + k, avail && cost <= S.credits, 'alt');
  });
  h += '</div></div>';
  h += '<div class="sec"><h3>Bank</h3><div class="card" style="display:flex;flex-direction:column;gap:8px">';
  h += '<div class="row"><span>Deposit <span class="dim">(' + (GT.CFG.DEPOSIT_RATE * 100) + '% interest)</span></span><b class="num">' + fmt(S.bank) + 'c</b></div>';
  h += '<div class="row"><span>Loan <span class="dim">(' + (GT.CFG.LOAN_RATE * 100) + '% interest)</span></span><b class="num ' + (S.loan ? 'bad' : '') + '">' + fmt(S.loan) + 'c</b></div>';
  h += '<div class="row"><input class="val" id="in-dep" type="number" min="0" step="1" value="' + ui.dep + '" aria-label="Deposit amount">' + btn('Deposit', 'deposit', ui.dep > 0 && ui.dep <= S.credits) + '</div>';
  h += '<div class="row"><input class="val" id="in-wd" type="number" min="0" step="1" value="' + ui.wd + '" aria-label="Withdraw amount">' + btn('Withdraw', 'withdraw', ui.wd > 0 && ui.wd <= S.bank) + '</div>';
  h += '<div class="row"><span class="dim">Fixed amount</span>' + btn('Take Loan ' + fmt(GT.CFG.LOAN_STEP) + 'c', 'loan', GT.canLoan(S)) + '</div>';
  h += '<div class="row"><input class="val" id="in-rep" type="number" min="0" step="1" value="' + ui.rep + '" aria-label="Repay amount">' + btn('Repay Loan', 'repay', ui.rep > 0 && S.loan > 0 && S.credits > 0) + '</div>';
  h += '<div class="dim" style="font-size:11px">Interest is added every ' + GT.CFG.INTEREST_EVERY + ' jumps. Loans are capped at ' + fmt(GT.CFG.LOAN_CAP) + 'c.</div></div></div>';
  return h;
}

function trendHTML(i) {
  if (S.trendHidden[i]) return '<span class="dim" title="No price report for this item today">?</span>';
  var t = GT.trend(S, S.loc, i) * 100;
  return '<span class="' + (t >= 0 ? 'up' : 'dn') + '" title="Price against the item\'s base price of ' + GT.ITEMS[i].base + 'c">' + (t >= 0 ? '▲ +' : '▼ ') + Math.round(t) + '%</span>';
}

function renderCol2() {
  var p = GT.PLANETS[S.loc], h = '', t = GT.taxInfo(S, S.loc), v = S.visit;
  h += '<div class="planetart"><canvas id="pc" role="img" aria-label="' + esc(p.name) + ', a ' + p.type.toLowerCase() + ' world"></canvas><div class="tag"><div class="pname">' + esc(p.name) + '</div><div class="say">' + esc(p.say) + ' &middot; ' + p.type + '</div></div></div>';
  h += '<div class="acts">';
  if (p.fuelSold) {
    var fp = GT.fuelPrice(S, S.loc), room = S.ship.fuelMax - S.ship.fuel;
    h += btn('Refuel +10', 'ref10', room > 0 && S.credits >= fp) + btn('Fill tank', 'refall', room > 0 && S.credits >= fp);
  } else h += '<span class="dim" style="align-self:center">No fuel dock here.</span>';
  h += btn(v.explored ? 'Explored' : 'Explore', 'explore', !v.explored && !S.pending) + btn(v.encountered ? 'Met someone' : 'Seek Encounter', 'encounter', !v.encountered && !S.pending);
  if (p.gambling) h += btn('Parlour of Thin Hours', 'gamble', GT.canGamble(S), 'alt');
  h += '</div>';
  if (p.fuelSold) h += '<div class="dim" style="font-size:12px">Fuel here: <b class="num">' + GT.fuelPrice(S, S.loc) + 'c</b> per PC' + (GT.depotCut(S) ? ' (depot discount applied)' : '') + '.</div>';
  h += '<div class="dim" style="font-size:12px">' + esc(p.desc) + '</div>';
  if (v.offer) {
    var f = GT.facDef(v.offer.type);
    h += '<div class="card offer"><div class="row"><b>Offer: ' + f.name + '</b><b class="num amber">' + fmt(v.offer.price) + 'c</b></div><div class="dim" style="font-size:12px;margin:4px 0 8px">' + f.blurb + ' ' + GT.facBenefitText(v.offer.type, v.offer.B) + '.</div>' + btn('Buy facility', 'facility', v.offer.price <= S.credits) + '</div>';
  } else if (S.owned[S.loc]) {
    var o = S.owned[S.loc]; h += '<div class="card" style="border-color:var(--good)"><b class="good">You own the ' + GT.facDef(o.type).name + ' here.</b></div>';
  }
  h += '<div class="sec"><div class="row"><h3>Market</h3><span class="num" style="font-size:12px" title="' + esc(GT.discText(t)) + '">Planet tax <b>' + (t.rate * 100).toFixed(1) + '%</b> <span class="dim">(base ' + (t.base * 100).toFixed(1) + '%)</span></span></div><div class="market">';
  GT.ITEMS.forEach(function (it, i) {
    var q = qtyOf(i), held = S.cargo[i].qty, stock = S.markets[S.loc][i].stock, mx = GT.maxBuy(S, i);
    h += '<div class="mrow" data-i="' + i + '"><span class="nm" title="' + esc(it.blurb) + '">' + it.name + (held ? ' <span class="dim">(' + held + ')</span>' : '') + '</span>';
    h += '<span class="num"><b>' + fmt(GT.price(S, S.loc, i)) + 'c</b></span><span class="num dim" title="Units for sale">' + stock + ' in stock</span>' + trendHTML(i);
    h += '<div class="ctl">' + btn('Buy', 'buy', GT.canBuy(S, i, q)) + btn('Max', 'max', mx > 0) + '<input class="qty" type="number" min="1" step="1" value="' + q + '" aria-label="Quantity of ' + it.name + '">' + btn('Sell', 'sell', GT.canSell(S, i, q)) + btn('All', 'all', held > 0) + '</div></div>';
  });
  return h + '</div></div>';
}

function renderCol3() {
  var h = '', d = ui.dest, P = GT.PLANETS;
  h += '<div class="sec"><h3>Star map</h3><div class="mapwrap">' + UI.mapSVG(S, d) + '</div><div class="dim" style="font-size:11px">Select a world to plan a jump. Red diamonds are rival traders.</div></div>';
  h += '<div class="sec"><h3>Trip plan</h3><div class="card trip">';
  if (d === null || d === S.loc) h += '<p class="dim">Select a destination on the map.</p>';
  else {
    var p = P[d], cost = GT.jumpCost(S, d), ok = S.ship.fuel >= cost, rivals = S.comps.filter(function (c) { return c.loc === d; });
    h += '<div class="row"><b style="font-size:15px;color:' + p.color + '">' + esc(p.name) + '</b><span class="dim">' + p.type + '</span></div>';
    h += '<p class="dim" style="font-size:12px">' + esc(p.desc) + '</p>';
    h += '<p>Distance <b class="num">' + GT.dist(S.loc, d).toFixed(0) + '</b> &middot; Fuel cost <b class="num ' + (ok ? '' : 'bad') + '">' + cost + ' PC</b> <span class="dim">(you have ' + S.ship.fuel + ')</span></p>';
    if (rivals.length) h += '<p class="dim" style="font-size:12px">Rivals docked there: ' + rivals.map(function (c) { return esc(c.name); }).join(', ') + '.</p>';
    if (!ok) h += '<p class="warn"><b>Warning:</b> you do not have enough fuel for this jump. ' + (P[S.loc].fuelSold ? 'Refuel here first.' : 'There is no fuel dock here.') + '</p>';
    h += btn('Jump', 'jump', GT.canJump(S, d), 'go');
  }
  if (GT.stranded(S) && !S.over) { var tt = P[GT.towTarget(S)]; h += '<p class="warn" style="margin-top:8px"><b>Stranded:</b> not enough fuel for any jump.</p>' + btn('Call a tow to ' + esc(tt.name) + ' (' + GT.CFG.TOW_COST + 'c)', 'tow', true, 'alt'); }
  h += '</div></div>';
  var rows = S.comps.map(function (c) { return { name: c.name + ' ' + c.title, cargo: c.cargo, speed: c.speed, w: c.wealth, me: false }; });
  rows.push({ name: S.name + ' (you)', cargo: S.ship.cargoMax, speed: GT.effSpeed(S), w: GT.networth(S), me: true });
  rows.sort(function (a, b) { return b.w - a.w; });
  h += '<div class="sec"><h3>Leaderboard</h3><div class="card" style="padding:6px;overflow-x:auto"><table><tr><th>#</th><th>Trader</th><th class="r">Cargo</th><th class="r">Speed</th><th class="r">Wealth</th></tr>';
  rows.forEach(function (r, i) { h += '<tr class="' + (r.me ? 'me' : '') + '"><td>' + (i + 1) + '</td><td>' + esc(r.name) + '</td><td class="r">' + r.cargo + '</td><td class="r">' + r.speed.toFixed(1) + '</td><td class="r">' + fmt(r.w) + 'c</td></tr>'; });
  return h + '</table></div><div class="dim" style="font-size:11px">Wealth is credits plus bank, minus loans. Reach ' + fmt(GT.CFG.WIN) + 'c to win.</div></div>';
}

function renderCol4() {
  var shown = GT.CFG.LOG_SHOWN + ui.more, h = '<div class="row"><h3>Flight log</h3><button class="tbtn" data-act="info" aria-label="How to play">? How to play</button></div><div class="log">';
  S.log.slice(0, shown).forEach(function (e) { h += '<div class="le ' + e.kind + '"><span class="tn">[Turn ' + e.turn + ']</span> ' + e.text + '</div>'; });
  if (S.log.length > shown) h += '<button class="btn alt" data-act="more">Show older entries (' + (S.log.length - shown) + ')</button>';
  return h + '</div>';
}

function paint(id, html) { var el = $(id), st = el.scrollTop; el.innerHTML = html; el.scrollTop = st; }
function render() {
  if (!S) return;
  paint('c1', renderCol1()); paint('c2', renderCol2()); paint('c3', renderCol3());
  var lg = $('c4'), st = lg.scrollTop; lg.innerHTML = renderCol4(); lg.scrollTop = st;
  var cv = $('pc'), p = GT.PLANETS[S.loc];
  if (cv) { if (!ui.cache[p.id]) { var off = document.createElement('canvas'); UI.drawPlanet(off, p); ui.cache[p.id] = off; } cv.width = ui.cache[p.id].width; cv.height = ui.cache[p.id].height; cv.style.aspectRatio = '480 / 270'; cv.getContext('2d').drawImage(ui.cache[p.id], 0, 0); }
  $('topstat').textContent = 'Turn ' + S.turn + '  |  Net worth ' + fmt(GT.networth(S)) + 'c of ' + fmt(GT.CFG.WIN) + 'c';
  ['c1', 'c2', 'c3', 'c4'].forEach(function (c) { $(c).classList.toggle('on', c === ui.tab); });
  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (t) { t.classList.toggle('on', t.dataset.tab === ui.tab); });
}

/* Galactic Trader. Part 9b: popups, the start screen, actions and boot. */
function openModal(html, wide) { var m = $('modal'); m.innerHTML = '<div class="sheet' + (wide ? ' wide' : '') + '" role="dialog" aria-modal="true">' + html + '</div>'; m.hidden = false; var b = m.querySelector('button'); if (b) b.focus({ preventScroll: true }); }
function closeModal() { $('modal').hidden = true; $('modal').innerHTML = ''; }

var INFO = '<h2>How to play Galactic Trader</h2>' +
  '<h4>The goal</h4><p>Build your fortune to <b>150,000 credits</b>. Your wealth is your credits plus your bank deposit, minus any loan. You lose if you have <b>zero or fewer credits and an empty hold</b>. Both are checked only when a planet jump finishes, so a bad day is not final until you jump.</p>' +
  '<h4>Resources</h4><ul><li><b>Credits (c):</b> the cash you carry. The bank holds the rest.</li><li><b>Fuel (PC):</b> every jump burns fuel. Faster engines burn less. Only about half the worlds sell fuel.</li><li><b>Cargo:</b> seven goods: Rations, Metals, Medical, Spices, Circuitry, Dark Matter and Artifacts. Your hold has a fixed size.</li><li><b>Reputation:</b> grows when you buy facilities, sabotage rivals successfully, and help them. It cuts your tax and tilts luck toward good outcomes. It falls when you are caught or fail.</li></ul>' +
  '<h4>Trading</h4><ul><li>Each world makes some goods cheaply, so their price is low there. Buy where a good is abundant and sell on the far side of the map, where it is scarce.</li><li>Prices follow supply and demand. Buying drains stock and raises the price. Selling floods the market and lowers it. Markets slowly recover, and random shortages and gluts also move them.</li><li>The trend shows today\'s price against the item\'s base price. About one item in four has no report, shown as a question mark.</li><li>Every trade is taxed. Facilities and reputation reduce the rate. Prices and stock on other worlds cannot be seen, but each description hints at what is plentiful.</li></ul>' +
  '<h4>Travel, events and encounters</h4><ul><li>Select a world on the map and press Jump. Roughly 3 trips in 10 meet an event: a windfall, a pirate, a breakdown, and many more.</li><li>On each visit you may <b>Explore</b> once (about a 1 in 4 chance of something happening) and <b>Seek Encounter</b> once (about 3 in 10). Each world has its own characters.</li><li>Some worlds sell ship upgrades: more cargo, a faster engine, a bigger tank. A bigger tank starts empty.</li><li>Stuck without the fuel for any jump? A tug will drag you to a fuel dock, for a fee.</li></ul>' +
  '<h4>Facilities</h4><p>About 1 trip in 5 brings an offer to buy a facility on the world you reach. It stands while you are docked, so sell cargo first if you need the money. Brokers improve your trades, depots cut fuel costs, and factories, warehouses and hotels collect fees from rivals, which you receive when you next visit. A facility costs about 20 times the benefit it brings per jump, and owning one raises your reputation.</p>' +
  '<h4>Bank</h4><p>Deposits earn 3% and loans cost 5%. Interest is added every 4 jumps. You can take a loan of 1,000c at a time. Withdraw before you jump if you want cash on hand.</p>' +
  '<h4>Rivals</h4><p>Four rival traders roam the map and compete on the leaderboard. When you share a world with one, you may get to <b>Sabotage</b>, <b>Assist</b> or <b>Ignore</b> them. Sabotage is risky, and being caught costs you. Assisting costs money or fuel and may be repaid generously, thanked, or snubbed.</p>' +
  '<h4>Gambling</h4><p>One world runs a strange parlour. Nobody explains the rules, and the odds are described only in words. The house keeps an edge in the long run.</p>' +
  '<div class="row" style="justify-content:flex-end"><button class="btn" data-act="close">Got it</button></div>';

function compModal() {
  var pe = S.pending, c = S.comps[pe.ci], att = c.wealth > GT.networth(S) * 1.3 ? 'They look you over with open scorn.' : c.wealth < GT.networth(S) * 0.7 ? 'They watch you with careful, hungry respect.' : 'They give you a polite and professional nod.';
  openModal('<h2>A rival at the dock</h2><p><b>' + esc(c.name) + '</b>, ' + esc(c.title) + ', is currently docked here. They are ' + pe.mood + '. ' + att + '</p>' +
    '<p class="dim">Their ship: cargo ' + c.cargo + ', warp ' + c.speed.toFixed(1) + '. What do you do?</p>' +
    '<div class="acts"><button class="btn" data-act="comp-sabotage">Sabotage</button><button class="btn alt" data-act="comp-assist">Assist (about ' + fmt(GT.compAssistCost(S)) + 'c or some fuel)</button><button class="btn alt" data-act="comp-ignore">Ignore</button></div>' +
    '<p class="dim" style="font-size:12px">Sabotage has a low chance to work and a low chance of backfiring. If you cannot afford to assist, you will ignore them instead.</p>');
}

function gambleModal(last) {
  var h = '<div class="row"><h2>The Parlour of Thin Hours</h2><b class="num">' + fmt(S.credits) + 'c</b></div><p class="dim">Smoke, low light and no printed rules. ' + esc(GT.GAME_LUCK_NOTE) + '</p>';
  if (last) h += '<div class="card" style="border-color:' + (last.net > 0 ? 'var(--good)' : last.net < 0 ? 'var(--bad)' : 'var(--line)') + '"><b class="' + (last.net > 0 ? 'good' : last.net < 0 ? 'bad' : '') + '">' + (last.net > 0 ? '+' : last.net < 0 ? '-' : '') + fmt(Math.abs(last.net)) + 'c</b> &nbsp;' + esc(last.text) + '</div>';
  GT.GAMES.forEach(function (g, gi) {
    h += '<div class="card"><b>' + esc(g.name) + '</b><p class="dim" style="font-size:12px;margin:4px 0 8px">' + esc(g.blurb) + '</p><div class="acts">';
    GT.STAKES.forEach(function (st) { h += '<button class="btn alt" data-act="gamble-' + gi + '-' + st + '"' + (st <= S.credits ? '' : ' disabled') + '>Wager ' + fmt(st) + 'c</button>'; });
    h += '</div></div>';
  });
  openModal(h + '<div class="row" style="justify-content:flex-end"><button class="btn" data-act="close">Leave the table</button></div>', true);
}

function endModal() {
  var o = S.over, st = S.stats, h = '<h2 class="' + (o.won ? 'win' : 'lose') + '">' + (o.won ? 'You made your fortune' : 'You are ruined') + '</h2><p>' + esc(S.name) + ', after <b>' + st.jumps + ' jumps</b> (turn ' + o.turn + '). ' + esc(o.why) + '</p>';
  var tb = 0, ts = 0, sp = 0, er = 0;
  h += '<h4>Goods traded</h4><div style="overflow-x:auto"><table><tr><th>Item</th><th class="r">Bought</th><th class="r">Spent</th><th class="r">Sold</th><th class="r">Earned</th></tr>';
  GT.ITEMS.forEach(function (it, i) { tb += st.bought[i]; ts += st.sold[i]; sp += st.spent[i]; er += st.earned[i]; h += '<tr><td>' + it.name + '</td><td class="r">' + st.bought[i] + '</td><td class="r">' + fmt(st.spent[i]) + 'c</td><td class="r">' + st.sold[i] + '</td><td class="r">' + fmt(st.earned[i]) + 'c</td></tr>'; });
  h += '<tr><td><b>Total</b></td><td class="r"><b>' + tb + '</b></td><td class="r"><b>' + fmt(sp) + 'c</b></td><td class="r"><b>' + ts + '</b></td><td class="r"><b>' + fmt(er) + 'c</b></td></tr></table></div>';
  function r(a, b, cls) { return '<div class="row"><span class="dim">' + a + '</span><b class="num ' + (cls || '') + '">' + b + '</b></div>'; }
  h += '<div class="cols2"><div><h4>Money</h4>' + r('Final net worth', fmt(GT.networth(S)) + 'c') + r('Peak net worth', fmt(st.peak) + 'c') + r('Tax paid', fmt(st.tax) + 'c') + r('Tax discount from reputation', fmt(st.taxSavedRep) + 'c', 'good') + r('Tax discount from facilities', fmt(st.taxSavedFac) + 'c', 'good') + r('Broker price edge', fmt(st.brokerEdge) + 'c', 'good') + r('Gained from events', fmt(st.eventGain) + 'c', 'good') + r('Lost to events', fmt(st.eventLoss) + 'c', 'bad') + r('Bank interest earned', fmt(st.interestEarned) + 'c', 'good') + r('Loan interest paid', fmt(st.interestPaid) + 'c', 'bad') + r('Rival fees collected', fmt(st.feeIncome) + 'c', 'good') + r('Gambling net', (st.gambleNet >= 0 ? '+' : '-') + fmt(Math.abs(st.gambleNet)) + 'c', st.gambleNet >= 0 ? 'good' : 'bad') + '</div>' +
    '<div><h4>Journey</h4>' + r('Jumps made', st.jumps) + r('Events met on the road', st.events) + r('Worlds explored', st.explores) + r('Encounters sought', st.encounters) + r('Fuel bought', st.fuelBought + ' PC for ' + fmt(st.fuelSpent) + 'c') + r('Tows needed', st.tows) + r('Facilities bought', st.facilitiesBought + ' (' + GT.facCount(S) + ' kept)') + r('Spent on ship upgrades', fmt(st.upgradesSpent) + 'c') + r('Sabotage attempts', st.sabotage + ' (' + st.sabotageWon + ' worked)') + r('Rivals assisted', st.assists) + r('Reputation', S.rep + ' now, peak ' + st.repPeak + ', low ' + st.repLow) + r('Gambling rounds', st.gambleRounds) + '</div></div>';
  openModal(h + '<div class="row" style="justify-content:flex-end"><button class="btn alt" data-act="close">View the log</button><button class="btn" data-act="new">Play again</button></div>', true);
}

/* ---------- start screen ---------- */
function renderStart() {
  var mx = { cargo: 75, speed: 2.2, fuel: 190 }, h = '<div class="in"><div><div class="title">Galactic Trader</div><p class="tag2">Seven worlds. Seven goods. Four rivals who would love to see you fail. Buy low, haul far, sell high, and reach 150,000 credits before the dark swallows your last coin.</p></div>';
  h += '<div class="ships" role="group" aria-label="Choose your ship">';
  GT.SHIPS.forEach(function (sh) {
    function m(l, v, k) { return '<span>' + l + '</span><span class="bar"><i style="width:' + Math.round(v / mx[k] * 100) + '%"></i></span><span>' + (k === 'speed' ? v.toFixed(1) : v) + '</span>'; }
    h += '<button class="ship" data-act="pick-' + sh.id + '" aria-pressed="' + (ui.ship === sh.id) + '"><div style="background:#04060f;border-radius:6px">' + UI.shipSVG(sh.id, sh.hue) + '</div><div class="sn">' + esc(sh.name) + '</div><div class="mini">' + m('Cargo', sh.cargo, 'cargo') + m('Speed', sh.speed, 'speed') + m('Fuel', sh.fuel, 'fuel') + '</div><div class="sd">' + esc(sh.desc) + '</div></button>';
  });
  h += '</div><div class="launch"><label>Captain name<input id="in-name" type="text" maxlength="20" placeholder="Captain" value="' + esc(ui.name) + '" autocomplete="off"></label><button class="btn" data-act="launch">Launch</button></div></div>';
  $('start').innerHTML = h; $('start').hidden = false;
}

/* ---------- actions ---------- */
function rowI(el) { var r = el.closest('.mrow'); return r ? +r.dataset.i : -1; }
function afterAction(jumped) {
  if (jumped) { ui.dep = 0; ui.wd = 0; ui.rep = 0; ui.dest = null; ui.more = 0; }
  render(); $('c4').scrollTop = 0;
  if (S.over) endModal(); else if (S.pending && $('modal').hidden) compModal();
}
function setTheme(t) { document.documentElement.setAttribute('data-theme', t); $('btnTheme').textContent = t === 'dark' ? 'Theme: Dark' : 'Theme: Light'; try { localStorage.setItem('gt-theme', t); } catch (e) {} }

function act(a, el) {
  if (a.indexOf('pick-') === 0) { ui.ship = a.slice(5); Array.prototype.forEach.call(document.querySelectorAll('.ship'), function (b) { b.setAttribute('aria-pressed', String(b.dataset.act === a)); }); return; }
  if (a === 'launch') {
    var nm = ($('in-name').value || '').trim() || 'Captain'; ui.name = nm; S = GT.newState(ui.ship, nm); ui.dest = null; ui.qty = {}; ui.dep = ui.wd = ui.rep = 0; ui.more = 0; ui.tab = 'c1'; ui.cache = ui.cache || {};
    GT.log(S, 'Welcome aboard, <b>' + esc(nm) + '</b>. You start at <b>Kryndor Spire</b> with ' + fmt(S.credits) + 'c and a ' + GT.SHIPS.filter(function (x) { return x.id === S.shipId; })[0].name + '. Reach ' + fmt(GT.CFG.WIN) + 'c to win.', 'info');
    GT.log(S, 'Tip: goods are cheap where they are made. Look at each world\'s description, pick a far world on the star map, and sell what you carry where it is scarce.', 'info');
    $('start').hidden = true; closeModal(); render(); return;
  }
  if (a === 'close') { closeModal(); return; }
  if (a === 'info') { openModal(INFO, true); return; }
  if (a === 'theme') { setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'); return; }
  if (a === 'new') { if (!S || S.over || el.dataset.sure) { S = null; closeModal(); renderStart(); } else openModal('<h2>Abandon this voyage?</h2><p>Your current game will be lost.</p><div class="row" style="justify-content:flex-end"><button class="btn alt" data-act="close">Keep playing</button><button class="btn" data-act="new" data-sure="1">Abandon</button></div>'); return; }
  if (a === 'tab') { ui.tab = el.dataset.tab; render(); return; }
  if (!S) return;
  if (a === 'more') { ui.more += 60; render(); return; }
  if (S.over) return;
  var i = rowI(el), jumped = false, q;
  if (a === 'buy') GT.buy(S, i, qtyOf(i));
  else if (a === 'max') GT.buy(S, i, GT.maxBuy(S, i));
  else if (a === 'sell') GT.sell(S, i, qtyOf(i));
  else if (a === 'all') GT.sell(S, i, S.cargo[i].qty);
  else if (a === 'ref10') GT.refuel(S, 10);
  else if (a === 'refall') GT.refuel(S, 9999);
  else if (a === 'explore') GT.explore(S);
  else if (a === 'encounter') GT.encounter(S);
  else if (a.indexOf('up-') === 0) GT.upgrade(S, a.slice(3));
  else if (a === 'deposit') { GT.deposit(S, ui.dep); ui.dep = 0; }
  else if (a === 'withdraw') { GT.withdraw(S, ui.wd); ui.wd = 0; }
  else if (a === 'loan') GT.takeLoan(S);
  else if (a === 'repay') { GT.repay(S, ui.rep); ui.rep = 0; }
  else if (a === 'facility') GT.buyFacility(S);
  else if (a === 'jump') { jumped = GT.jump(S, ui.dest); }
  else if (a === 'tow') { jumped = GT.tow(S); }
  else if (a === 'gamble') { gambleModal(null); return; }
  else if (a.indexOf('gamble-') === 0) { var pr = a.split('-'); var res = GT.gamble(S, +pr[1], +pr[2]); gambleModal(res); render(); return; }
  else if (a.indexOf('comp-') === 0) { GT.compAction(S, a.slice(5)); closeModal(); }
  afterAction(jumped);
}

document.addEventListener('click', function (e) {
  var pl = e.target.closest('.pl');
  if (pl && S && !S.over) { var i = +pl.dataset.i; ui.dest = i === S.loc || ui.dest === i ? null : i; render(); return; }
  var el = e.target.closest('[data-act]'); if (el && !el.disabled) act(el.dataset.act, el);
});
document.addEventListener('keydown', function (e) {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('pl') && S && !S.over) { e.preventDefault(); var i = +e.target.dataset.i; ui.dest = i === S.loc || ui.dest === i ? null : i; render(); }
  if (e.key === 'Escape' && !$('modal').hidden && !(S && S.pending)) closeModal();
});
function setDis(sel, ok) { var b = document.querySelector(sel); if (b) b.disabled = !ok || !!(S && S.over); }
document.addEventListener('input', function (e) {
  var t = e.target; if (!S) return;
  var v = Math.max(0, Math.floor(+t.value || 0));
  if (t.classList.contains('qty')) {
    var row = t.closest('.mrow'), i = +row.dataset.i; ui.qty[i] = Math.max(1, v);
    row.querySelector('[data-act="buy"]').disabled = !GT.canBuy(S, i, ui.qty[i]) || !!S.over; row.querySelector('[data-act="sell"]').disabled = !GT.canSell(S, i, ui.qty[i]) || !!S.over;
  } else if (t.id === 'in-dep') { ui.dep = v; setDis('[data-act="deposit"]', v > 0 && v <= S.credits); }
  else if (t.id === 'in-wd') { ui.wd = v; setDis('[data-act="withdraw"]', v > 0 && v <= S.bank); }
  else if (t.id === 'in-rep') { ui.rep = v; setDis('[data-act="repay"]', v > 0 && S.loan > 0 && S.credits > 0); }
  else if (t.id === 'in-name') ui.name = t.value;
});

/* ---------- boot ---------- */
(function () {
  var t = null; try { t = localStorage.getItem('gt-theme'); } catch (e) {}
  if (t !== 'dark' && t !== 'light') t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  setTheme(t); renderStart();
})();

</script>
