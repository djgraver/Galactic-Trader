<style>
/* Galactic Trader Deluxe. Look: a 90s point-and-click comedy. Thick ink outlines, hard offset shadows, loud colour.
   Layout: header bar, one full-size stage that holds whichever location you are visiting, then a HUD with the verb-line.
   Theme: Day (cream paper, bright toys) and Night (deep purple, neon edges). Both are defined as tokens below. */
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 500 21px/1.4 var(--ui); overflow: hidden; }
button, input { font: inherit; color: inherit; }
b { font-weight: 700; }
#app { height: 100%; display: flex; flex-direction: column; background: radial-gradient(circle at 20% 10%, rgba(255, 255, 255, .25) 0 2px, transparent 3px) 0 0 / 22px 22px, var(--bg); }
.dim { color: var(--dim); } .num { font-variant-numeric: tabular-nums; } .good { color: var(--good); } .bad { color: var(--bad); } .amber { color: var(--orange); }

/* ---------- header and HUD ---------- */
#bar { flex: none; display: flex; align-items: center; gap: 10px; padding: 6px max(16px, env(safe-area-inset-right, 0px)) 6px max(16px, env(safe-area-inset-left, 0px)); background: var(--purple); border-bottom: 4px solid var(--ink); color: #fff3cf; }
.logo { font: 11px/1 var(--display); letter-spacing: .06em; color: var(--mustard); text-shadow: 2px 2px 0 var(--ink), -1px -1px 0 var(--ink), 1px -1px 0 var(--ink), -1px 1px 0 var(--ink); white-space: nowrap; }
.where { flex: 1; min-width: 0; text-align: center; font: 8px var(--display); letter-spacing: .06em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 2px 2px 0 var(--ink); }
.ibs { display: flex; gap: 6px; }
.ib { height: 32px; min-width: 34px; padding: 0 9px; border: 3px solid var(--ink); border-radius: 9px; background: var(--paper); color: var(--fg); font: 8px var(--display); letter-spacing: .05em; cursor: pointer; box-shadow: 2px 2px 0 var(--ink); }
.ib:hover { background: var(--mustard); color: var(--ink); } .ib:active { transform: translate(2px, 2px); box-shadow: none; }
#stage { flex: 1; min-height: 0; position: relative; overflow: hidden; }
#hud { flex: none; background: var(--hud); color: var(--hudfg); border-top: 4px solid var(--ink); padding: 4px max(16px, env(safe-area-inset-right, 0px)) 6px max(16px, env(safe-area-inset-left, 0px)); }
#sentence { font: 33px/1.1 var(--mono); color: var(--sentence); min-height: 26px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: .02em; }
.stats { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; }
.chip { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 19px; white-space: nowrap; }
.chip .bar { width: 70px; height: 10px; border: 2px solid var(--ink); border-radius: 6px; background: #2a1650; overflow: hidden; }
.chip .bar i { display: block; height: 100%; background: var(--lime); } .chip .bar i.f { background: var(--orange); } .chip .bar i.w { background: var(--mustard); }
.chip svg { width: 22px; height: 22px; }
.who-mini { display: flex; align-items: center; gap: 6px; } .who-mini svg { width: 30px; height: 34px; background: #fff3cf; border: 2px solid var(--ink); border-radius: 50%; }

/* ---------- comic parts ---------- */
.panel { background: var(--panel); border: 4px solid var(--line); border-radius: 16px; box-shadow: 6px 6px 0 var(--shadow); padding: 12px; min-width: 0; }
h2.hd { margin: 0 0 6px; font: 13px/1 var(--display); letter-spacing: .05em; color: var(--pink); text-shadow: 2px 2px 0 var(--ink); }
h3.hd { margin: 0 0 4px; font: 8px/1 var(--display); letter-spacing: .08em; color: var(--orange); }
.btn { height: 34px; padding: 0 14px; border: 3px solid var(--ink); border-radius: 10px; background: var(--orange); color: var(--btnfg); font: 8px/1 var(--display); letter-spacing: .06em; cursor: pointer; box-shadow: 3px 3px 0 var(--ink); white-space: nowrap; }
.btn.green { background: var(--lime); color: var(--ink); } .btn.blue { background: var(--blue); color: #fff; } .btn.pink { background: var(--pink); color: #fff; } .btn.gold { background: var(--mustard); color: var(--ink); }
.btn.big { height: 44px; padding: 0 22px; font-size: 36px; }
.btn:hover:not(:disabled) { filter: brightness(1.1); transform: translate(-1px, -1px); } .btn:active:not(:disabled) { transform: translate(3px, 3px); box-shadow: none; }
.btn:disabled { background: var(--grey); color: var(--greytext); border-color: var(--greytext); box-shadow: none; cursor: not-allowed; }
.btn:focus-visible, .ib:focus-visible, .ship:focus-visible, input:focus-visible, .hs:focus-visible { outline: 3px dashed var(--pink); outline-offset: 3px; }
input[type="number"], input[type="text"] { height: 34px; min-width: 0; border: 3px solid var(--ink); border-radius: 9px; background: #fff; color: #1d0f33; padding: 0 8px; font-weight: 600; }
.qty { width: 62px; text-align: center; } .val { width: 100px; }
.bubble { position: relative; background: #fff; color: #1d0f33; border: 4px solid var(--ink); border-radius: 18px; padding: 10px 14px; font-weight: 600; box-shadow: 4px 4px 0 var(--shadow); }
.bubble::before { content: ''; position: absolute; left: -22px; top: 26px; border: 10px solid transparent; border-right: 18px solid var(--ink); }
.bubble::after { content: ''; position: absolute; left: -14px; top: 29px; border: 7px solid transparent; border-right: 13px solid #fff; }
.bubble .nm { display: block; font: 8px var(--display); letter-spacing: .07em; color: var(--pink); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; min-width: 0; }
.acts { display: flex; flex-wrap: wrap; gap: 8px; }

/* ---------- hub street ---------- */
.hub { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 12px; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); }
.scenebox { min-height: 0; min-width: 0; border: 4px solid var(--ink); border-radius: 14px; overflow: hidden; box-shadow: 6px 6px 0 var(--shadow); background: #000; position: relative; }
svg.scene { display: block; width: 100%; height: 100%; }
.hs { cursor: pointer; transition: filter .12s; } .hs:hover, .hs:focus { filter: brightness(1.2) drop-shadow(0 0 7px #fff); }
.hs.closed { filter: grayscale(.5); }
.sprite .bob { animation: bob 1.6s ease-in-out infinite; } .walking .sprite .bob { animation-duration: .32s; }
@keyframes bob { 0%, 100% { transform: translate(50px, 52px) scale(var(--hs, .62)); } 50% { transform: translate(50px, 49px) scale(var(--hs, .62)); } }
.walking .l1 { animation: step .32s linear infinite; } .walking .l2 { animation: step .32s linear infinite reverse; }
.leg { transform-box: fill-box; transform-origin: 50% 0; } @keyframes step { 0%, 100% { transform: rotate(18deg); } 50% { transform: rotate(-18deg); } }
#player { transition: transform .75s cubic-bezier(.45, .05, .55, .95); }
.logbox { min-height: 0; display: flex; flex-direction: column; gap: 8px; }
.logbox .log { flex: 1; min-height: 0; overflow-y: auto; }
.log { display: flex; flex-direction: column; gap: 6px; font-size: 18px; }
.le { padding: 6px 9px; border: 3px solid var(--ink); border-left-width: 8px; border-radius: 8px; background: var(--paper); overflow-wrap: anywhere; line-height: 1.35; }
.le.gain { border-left-color: var(--good); color: var(--good); background: var(--panel); } .le.loss { border-left-color: var(--bad); color: var(--bad); background: var(--panel); }
.le.event { border-left-color: var(--mustard); } .le .tn { font: 8px var(--display); letter-spacing: .06em; margin-right: 4px; opacity: .8; } .le .fx { opacity: .9; }

/* ---------- location pages ---------- */
.loc { position: relative; height: 100%; overflow-y: auto; }
.loc > .bg { position: absolute; inset: 0; width: 100%; height: 100%; }
.loc .in { position: relative; display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 14px; padding: 14px max(16px, env(safe-area-inset-right, 0px)) 18px max(16px, env(safe-area-inset-left, 0px)); min-height: 100%; align-items: start; }
.cast { display: flex; flex-direction: column; gap: 10px; align-items: stretch; }
.cast .card { background: var(--paper); border: 4px solid var(--ink); border-radius: 16px; box-shadow: 5px 5px 0 var(--shadow); padding: 8px 8px 10px; text-align: center; }
.cast .card svg.portrait { width: 100%; max-height: 240px; }
.cast .card .cn { font: 9px var(--display); letter-spacing: .06em; color: var(--pink); } .cast .card .cj { font-size: 17px; color: var(--dim); }
.mk-row { display: grid; grid-template-columns: 44px minmax(0, 1.2fr) 74px 80px 74px auto; gap: 6px 10px; align-items: center; padding: 6px 10px; border-bottom: 2px dashed var(--line); }
.mk-row .ctl { display: flex; gap: 5px; align-items: center; } .mk-row .nm { font: 9px var(--display); letter-spacing: .05em; } .mk-row .held { font-size: 17px; color: var(--dim); display: block; font-family: var(--ui); letter-spacing: 0; }
.mk-head { font: 8px var(--display); letter-spacing: .1em; color: var(--dim); border-bottom: 3px solid var(--ink); }
.up { color: var(--orange); font-weight: 700; } .dn { color: var(--blue); font-weight: 700; }
.itemicon { width: 40px; height: 40px; }
.up-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 8px 4px; border-bottom: 2px dashed var(--line); }
.tax { display: inline-block; padding: 2px 10px; background: var(--mustard); color: var(--ink); border: 3px solid var(--ink); border-radius: 20px; font: 8px var(--display); letter-spacing: .05em; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.mapwrap { background: #000; border: 4px solid var(--ink); border-radius: 12px; overflow: hidden; }
.mapwrap svg { display: block; width: 100%; height: auto; } .mapwrap .pl { cursor: pointer; } .mapwrap svg text { font-family: var(--ui); }
table { width: 100%; border-collapse: collapse; font-size: 19px; } th { text-align: left; font: 8px var(--display); letter-spacing: .1em; color: var(--dim); padding: 4px; } td { padding: 5px 4px; border-top: 2px dashed var(--line); } td.r, th.r { text-align: right; } tr.me td { color: var(--pink); font-weight: 700; }
.pocket { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; } .slot { text-align: center; padding: 8px 4px; background: var(--paper); border: 3px solid var(--ink); border-radius: 12px; } .slot .itemicon { width: 52px; height: 52px; } .slot.empty { opacity: .45; }
.pad-pages { padding: 14px max(16px, env(safe-area-inset-right, 0px)) 18px max(16px, env(safe-area-inset-left, 0px)); height: 100%; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }

/* ---------- title, creator, flight, mini-games, modals ---------- */
.screen { position: fixed; inset: 0; z-index: 40; overflow-y: auto; background: radial-gradient(circle at 70% 0%, #ff7bd5 0, transparent 55%), linear-gradient(#3a1a8a, #1a0a4a 70%); color: #fff3cf; padding: 20px max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px)); }
.screen[hidden], .modal[hidden], .flight[hidden], .mg[hidden] { display: none; }
.screen .in { max-width: 1150px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.mega { font: clamp(46px, 11vw, 120px)/.9 var(--display); letter-spacing: .04em; color: var(--mustard); text-shadow: 4px 4px 0 var(--ink), -3px -3px 0 var(--ink), 3px -3px 0 var(--ink), -3px 3px 0 var(--ink), 8px 8px 0 var(--pink); transform: rotate(-2deg); text-wrap: balance; }
.sub { font: clamp(20px, 3vw, 32px) var(--display); letter-spacing: .08em; color: #8bf; text-shadow: 2px 2px 0 var(--ink); }
.creator { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 18px; align-items: start; }
.fate { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 19px; } .fate span:nth-child(odd) { color: var(--dim); }
.ships { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.ship { text-align: left; background: var(--paper); color: var(--fg); border: 4px solid var(--ink); border-radius: 14px; padding: 8px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; box-shadow: 4px 4px 0 var(--shadow); }
.ship[aria-pressed="true"] { background: var(--mustard); color: #1d0f33; transform: translate(-2px, -2px); box-shadow: 7px 7px 0 var(--ink); }
.ship svg { background: #0a0620; border: 3px solid var(--ink); border-radius: 8px; } .ship .sn { font: 9px var(--display); letter-spacing: .06em; } .ship .sd { font-size: 17px; }
.mini { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 8px; align-items: center; font-size: 17px; } .mini .bar { height: 8px; border: 2px solid var(--ink); border-radius: 5px; background: #fff; overflow: hidden; } .mini .bar i { display: block; height: 100%; background: var(--pink); }
.modal { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; padding: 14px; background: rgba(20, 8, 50, .72); }
.sheet { width: min(680px, 100%); max-height: 92%; overflow-y: auto; background: var(--panel); border: 5px solid var(--ink); border-radius: 18px; box-shadow: 8px 8px 0 var(--shadow); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.sheet.wide { width: min(820px, 100%); } .sheet h2 { margin: 0; font: 14px/1 var(--display); letter-spacing: .05em; color: var(--pink); text-shadow: 2px 2px 0 var(--ink); } .sheet h4 { margin: 6px 0 0; font: 8px var(--display); letter-spacing: .08em; color: var(--orange); } .sheet p { margin: 0; } .sheet ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 3px; }
.cols2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 4px 24px; }
.win { color: var(--good); } .lose { color: var(--bad); }

.flight { position: fixed; inset: 0; z-index: 60; background: #04020f; color: #fff3cf; overflow: hidden; cursor: pointer; }
.flight canvas.stars { position: absolute; inset: 0; width: 100%; height: 100%; }
.flight .pl { position: absolute; will-change: transform; } .flight .pl canvas { width: 100%; height: auto; display: block; border-radius: 50%; }
.flight .fship { position: absolute; left: 50%; top: 50%; width: min(34vw, 300px); transform: translate(-50%, -50%); animation: fl-bob 1.1s ease-in-out infinite; }
.flight .fship svg { width: 100%; filter: drop-shadow(0 0 14px rgba(255, 180, 70, .7)); }
@keyframes fl-bob { 0%, 100% { transform: translate(-50%, -52%) rotate(-1.5deg); } 50% { transform: translate(-50%, -48%) rotate(1.5deg); } }
.flight .cap { position: absolute; left: 50%; bottom: 8%; transform: translateX(-50%); width: min(720px, 92%); text-align: center; }
.flight .ticker { font: 36px/1.1 var(--mono); color: var(--sentence); text-shadow: 2px 2px 0 #000; min-height: 56px; }
.flight .prog { height: 16px; border: 3px solid #fff3cf; border-radius: 10px; background: #1a0a4a; overflow: hidden; margin-top: 8px; } .flight .prog i { display: block; height: 100%; background: linear-gradient(90deg, var(--orange), var(--mustard)); width: 0; }
.flight .top { position: absolute; top: 4%; left: 0; right: 0; text-align: center; font: clamp(26px, 5vw, 54px)/1 var(--display); letter-spacing: .08em; color: var(--mustard); text-shadow: 3px 3px 0 var(--ink); }
.flight .fcard { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-1deg); width: min(540px, 92%); }
.mg { position: fixed; inset: 0; z-index: 65; background: #12072e; color: #fff3cf; display: flex; flex-direction: column; }
.mg .mtop { display: flex; align-items: center; gap: 12px; padding: 8px 14px; background: var(--purple); border-bottom: 4px solid var(--ink); } .mg .mtop .t { font: 11px var(--display); letter-spacing: .06em; color: var(--mustard); text-shadow: 2px 2px 0 var(--ink); }
.mg .tbar { flex: 1; height: 16px; border: 3px solid var(--ink); border-radius: 9px; background: #2a1650; overflow: hidden; } .mg .tbar i { display: block; height: 100%; width: 100%; background: var(--lime); }
.mg .sc { font: 12px var(--display); letter-spacing: .06em; min-width: 90px; text-align: right; }
.mg .field { flex: 1; min-height: 0; display: grid; place-items: center; padding: 8px; position: relative; } .mg canvas { max-width: 100%; max-height: 100%; background: #000; border: 4px solid var(--ink); border-radius: 12px; touch-action: none; cursor: crosshair; }
.mg .card { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(520px, 92%); }
.mg .pads { display: flex; gap: 10px; justify-content: center; padding: 8px; } .mg .pads .btn { min-width: 80px; height: 48px; }
.toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); z-index: 80; padding: 8px 16px; border: 3px solid var(--ink); border-radius: 12px; background: var(--mustard); color: var(--ink); font: 8px var(--display); letter-spacing: .05em; box-shadow: 4px 4px 0 var(--ink); max-width: 92%; text-align: center; }

@media (max-width: 1100px) { .hub { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) 150px; } }
@media (max-width: 900px) {
  .loc .in { grid-template-columns: minmax(0, 1fr); } .cast { flex-direction: row; align-items: flex-start; } .cast .card { flex: 0 0 120px; } .cast .card svg.portrait { max-height: 130px; } .cast .talk { flex: 1; }
  .bubble::before, .bubble::after { display: none; }
  .mk-row { grid-template-columns: 40px minmax(0, 1fr) auto auto; } .mk-row .ctl { grid-column: 1 / -1; flex-wrap: wrap; }
  .creator { grid-template-columns: minmax(0, 1fr); } .where { display: none; } .logo { font-size: 30px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
/* Part 3 of the stylesheet: layout details added once the pages existed. */
.logbox > .panel.lg { flex: 1; min-height: 0; display: flex; flex-direction: column; } .logbox .panel.lg .log { flex: 1; min-height: 0; overflow-y: auto; }
.padgrid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 12px; align-items: start; } .padcol { display: flex; flex-direction: column; gap: 12px; }
.flight .pl { left: 0; top: 0; } .flight .pl svg { width: 100%; height: auto; display: block; }
.flight .panel, .mg .panel, .screen .panel, .screen .cast .card { color: var(--fg); }
.loc { overflow: hidden; } .loc .in { height: 100%; overflow-y: auto; align-content: start; }
.loc .in .main { min-width: 0; display: flex; flex-direction: column; gap: 12px; } .main .bubble { margin-left: 12px; }
.cast .card svg.portrait { display: block; margin: 0 auto; }
.mk-row .nm .held { max-width: 100%; } .mk-row.mk-head { padding-top: 0; padding-bottom: 2px; }
.panel .le { margin-top: 6px; }
.ship svg { width: 100%; height: auto; }
.mapwrap .pl:focus-visible { outline: none; } .mapwrap .pl:focus-visible circle:first-child { stroke: #ff3d8b; stroke-width: 2; }
.mini .bar i { background: var(--pink); }
@media (max-width: 1100px) {
  .hub { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); overflow-y: auto; align-content: start; }

}
@media (max-width: 900px) {
  .padgrid { grid-template-columns: minmax(0, 1fr); }

}

}

  .talk .btn { white-space: normal; height: auto; min-height: 44px; line-height: 1.1; padding: 6px 12px; font-size: 30px; }
}
@media (max-width: 560px) {
  .logo { font-size: 0; } .logo::before { content: 'GT'; font-size: 33px; }

}
.sheet > * { flex-shrink: 0; }
/* edges: fixed layers keep clear of phone system bars */
.screen { padding-top: calc(20px + env(safe-area-inset-top, 0px)); padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px)); }
.mg { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.mg .mtop { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Galactic Trader 3. The EGA skin: sixteen colours, hard pixels, square corners, bevelled grey windows in the Sierra style.

  --ink: #000; --line: #000; --bg: #000; --paper: #fff; --panel: #aaa; --panel2: #ff5; --fg: #000; --dim: #555;
  --orange: #00a; --pink: #a0a; --teal: #0aa; --lime: #5f5; --blue: #55f; --mustard: #ff5; --purple: #00a;
  --good: #060; --bad: #a00; --shadow: #000; --hud: #000; --hudfg: #aaa; --sentence: #ff5; --btnfg: #000;
  --grey: #777; --greytext: #444;

}

#bar { background: #fff; color: #000; border-bottom: 3px solid #000; box-shadow: none; padding-top: 3px; padding-bottom: 3px; gap: 12px; }

/* ---------- windows: grey panels with a bevel ---------- */

/* page titles that sit straight on the blue background, and planet-coloured headings inside grey windows */

/* Galactic Trader 4. The fixed retro frame.
   The whole game lives on one 1280 x 800 (16:10, the shape of a 320 x 200 VGA screen at 4x) stage. A little script (fitFrame in gt-20-app.js) scales that stage to the biggest size that fits
   the window and centres it on black, so an ultrawide monitor gets black bars instead of a stretched game. On a narrow phone screen the stage turns fluid (class "fluid") and the old
   responsive layout takes over. Every pop-up, title screen, flight and mini-game is position:fixed, which inside a transformed stage means "fixed to the stage". */
html, body { height: 100%; margin: 0; overflow: hidden; background: #000; }
#frame { position: fixed; left: 50%; top: 50%; width: 1280px; height: 800px; margin: -400px 0 0 -640px; transform: scale(var(--k, 1)); transform-origin: 50% 50%; overflow: hidden; background: #000; contain: layout paint; }
#frame.fluid { left: 0; top: 0; width: 100%; height: 100%; margin: 0; transform: none; contain: none; }
#app { height: 100%; width: 100%; }

/* viewport units from the fluid layout, pinned to the stage */
#frame:not(.fluid) .mega { font-size: 52px; }
#frame:not(.fluid) .sub { font-size: 12px; }
#frame:not(.fluid) .flight .top { font-size: 28px; }
#frame:not(.fluid) .flight .fship { width: 300px; }
#frame:not(.fluid) .loc > .bg { height: 100px; }
#frame:not(.fluid) .screen .in { max-width: 1180px; }
#frame:not(.fluid) .sheet { width: 760px; max-height: 760px; }
#frame:not(.fluid) .sheet.wide { width: 980px; }
#frame:not(.fluid) .modal { padding: 14px; }
#frame:not(.fluid) .toast { bottom: 80px; }

/* the stage itself: menu bar, optional round bar, the page, then the status strip */
#frame:not(.fluid) #bar { height: 40px; }
#frame:not(.fluid) #hud { height: 86px; }
/* Galactic Trader 4. The street: the picture keeps the 320 x 200 shape exactly, and the people and birds live in a layer above it. */
.scene { aspect-ratio: 320 / 200; width: min(100cqw, calc(100cqh * 1.6)); }
.scene > svg.crowd { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.crowd image { image-rendering: pixelated; }
/* Galactic Trader 4. The shop pages: compact so that a page fits the 1280 x 800 stage, plus the two-counter bank, the stock exchange and the smuggler's offers. */
.dim.bl { font-size: 19px; line-height: 1.05; }
#frame:not(.fluid) .loc .in { padding: 8px 14px 8px; gap: 12px; grid-template-columns: 260px minmax(0, 1fr); }
#frame:not(.fluid) .loc .in .main { gap: 8px; }
#frame:not(.fluid) .main .bubble { padding: 6px 10px; font-size: 22px; }
#frame:not(.fluid) .cast .card { padding: 6px; } #frame:not(.fluid) .cast .card .portrait { width: min(100%, 150px) !important; }
#frame:not(.fluid) .talk .btn.big { height: 38px; font-size: 10px; width: 100%; margin: 6px 0 0; }
#frame:not(.fluid) .loc .panel { padding: 8px 10px; }
#frame:not(.fluid) .mk-row { padding: 2px 8px; grid-template-columns: 44px minmax(0, 1.2fr) 70px 80px 70px auto; }
#frame:not(.fluid) .mk-row .itemicon { width: 38px; height: 38px; }
#frame:not(.fluid) .mk-row .held { font-size: 17px; line-height: 1; }
#frame:not(.fluid) .mk-row .btn { height: 30px; }
#frame:not(.fluid) .mk-row input.qty { height: 30px; }
#frame:not(.fluid) .panel > .dim[style*="margin-bottom:6px"] { margin-bottom: 2px !important; }

/* bank: two counters side by side */
.bankwrap > h2.hd { margin-bottom: 6px; }
.bank2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.bank2 .panel { background: #bbb; }
.bank2 .bal { font: 18px var(--display); margin: 2px 0 4px; }

.bk-row { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; margin: 6px 0; }

/* stock exchange */
.xchloc .in { grid-template-columns: 190px minmax(0, 1fr) !important; }
.xchloc .cast .card .cj { display: none; }
.xch .row { margin-bottom: 4px; }
.xsum { display: flex; gap: 8px 26px; flex-wrap: wrap; font-size: 21px; margin: 0 0 4px; }
.xr { display: grid; grid-template-columns: 150px 100px 62px 160px 182px minmax(0, 1fr); gap: 4px 10px; align-items: center; padding: 3px 4px; border-bottom: 2px dotted #555; }

  { id: 'meridoa', name: 'Meridoa', say: 'meh-RID-oh-ah', type: 'Agrarian', x: 8, y: 38, color: '#7ed957', ring: false,

  { id: 'ferrox', name: 'Ferrox', say: 'FEH-rox', type: 'Mining', x: 30, y: 12, color: '#d9603b', ring: false,

    desc: 'A red, pitted rock chewed hollow by a thousand drills. Metals pour out of Ferrox by the megaton and sell for next to nothing. The miners pay well for food and doctors, and Ferrox has a working fuel dock.' },
  { id: 'kryndor', name: 'Kryndor Spire', say: 'KRIN-dor SPYR', type: 'Megacity', x: 50, y: 30, color: '#4fd2ff', ring: false,

  { id: 'nihil', name: 'Nihil Station', say: 'NY-hill', type: 'Void Station', x: 58, y: 52, color: '#b07cff', ring: false,

/* Galactic Trader. Part 2: state, markets, tax and trading. No DOM access here. */
(function () {
  var rng = Math.random;
  GT.setRng = function (f) { rng = f; };
  GT.seeded = function (seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; };

  var clamp = GT.clamp, R = GT.R;

  /* ---------- state ---------- */
  GT.newState = function (shipId, name) {
    var sh = GT.SHIPS.filter(function (x) { return x.id === shipId; })[0] || GT.SHIPS[0];
    var s = {
      name: (name || 'Nameless').slice(0, 20), shipId: sh.id,
      ship: { cargoMax: sh.cargo, speed: sh.speed, fuelMax: sh.fuel, fuel: Math.round(sh.fuel * GT.CFG.START_FUEL_FRAC), lv: { cargo: 0, speed: 0, fuel: 0 }, damage: [] },
      credits: GT.CFG.START_CREDITS, bank: 0, loan: 0, rep: 0, turn: 1, loc: 3, dest: null,
      cargo: GT.ITEMS.map(function () { return { qty: 0, avg: 0 }; }),
      markets: [], fuelMult: [], mods: [], owned: {}, comps: [], log: [], over: null,
      visit: { explored: false, encountered: false, offer: null, flags: {} }, pending: null, trendHidden: [],
      stats: { jumps: 0, bought: [], spent: [], sold: [], earned: [], tax: 0, taxSavedRep: 0, taxSavedFac: 0, brokerEdge: 0,
        eventGain: 0, eventLoss: 0, events: 0, explores: 0, encounters: 0, fuelBought: 0, fuelSpent: 0, interestEarned: 0, interestPaid: 0,
        feeIncome: 0, facilitiesBought: 0, upgradesSpent: 0, sabotage: 0, sabotageWon: 0, assists: 0, gambleNet: 0, gambleRounds: 0,
        peak: GT.CFG.START_CREDITS, repPeak: 0, repLow: 0, tows: 0 }
    };
    GT.ITEMS.forEach(function () { s.stats.bought.push(0); s.stats.spent.push(0); s.stats.sold.push(0); s.stats.earned.push(0); });
    GT.PLANETS.forEach(function (p) {
      s.fuelMult.push(1);
      s.markets.push(GT.ITEMS.map(function (it, i) {
        var target = it.depth * clamp(Math.pow(1 / p.mult[i], 2.5), 0.4, 3.5);
        return { target: target, stock: Math.round(target * R(0.85, 1.15)), shock: 1 };
      }));
    });

PX.snap = function (cx, w, h) {
  if (!PX.LUT) { PX.LUT = new Uint8Array(32768); for (var r = 0; r < 32; r++) for (var g = 0; g < 32; g++) for (var b = 0; b < 32; b++) { var best = 0, bd = 1e9; for (var k = 0; k < 16; k++) { var q = PX.RGB[k], dr = r * 8 + 4 - q[0], dg = g * 8 + 4 - q[1], db = b * 8 + 4 - q[2], dd = dr * dr * 0.3 + dg * dg * 0.59 + db * db * 0.11; if (dd < bd) { bd = dd; best = k; } } PX.LUT[(r << 10) | (g << 5) | b] = best; } }
  var im = cx.getImageData(0, 0, w, h), d = im.data, i, c, L = PX.LUT, R = PX.RGB;
  for (i = 0; i < d.length; i += 4) { c = R[L[((d[i] >> 3) << 10) | ((d[i + 1] >> 3) << 5) | (d[i + 2] >> 3)]]; d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; d[i + 3] = 255; }
  cx.putImageData(im, 0, 0);
};

function infoHTML() { var WIN = fmt(GT.CFG.WIN); return '<h2>How to play</h2>' +
  '<h4>The goal</h4><p>Build your fortune to <b>' + WIN + ' credits</b>. Your wealth is your credits plus your bank deposit, minus any loan. You lose if you have <b>zero or fewer credits and an empty hold</b>. Both are checked only when a planet jump finishes, so a bad day is not final until you jump.</p>' +

  '<h4>Resources</h4><ul><li><b>Credits (c):</b> the cash you carry. The bank holds the rest.</li><li><b>Fuel (PC):</b> every jump burns fuel. Faster engines burn less.</li><li><b>Cargo:</b> seven goods: Rations, Metals, Medical, Spices, Circuitry, Dark Matter and Artifacts. Your hold has a fixed size.</li><li><b>Reputation:</b> grows when you buy facilities, sabotage rivals successfully, help them, and win Gold at odd jobs. It cuts your tax and tilts luck toward good outcomes. It falls when you are caught or fail.</li></ul>' +
  '<h4>Trading</h4><ul><li>Each world makes some goods cheaply, so their price is low there. Buy where a good is abundant and sell on the far side of the map, where it is scarce.</li><li>Buying drains stock and raises the price. Selling floods the market and lowers it. Markets slowly recover, and random shortages and gluts also move them.</li><li>The trend shows today\'s price against the item\'s base price. About one item in four has no report, shown as a question mark.</li><li>Every trade is taxed. Facilities and reputation reduce the rate.</li></ul>' +
  '<h4>Travel, events and encounters</h4><ul><li>Pick a world on the Launch Pad map and press Jump. Roughly 3 trips in 10 meet an event on the way.</li><li>On each visit you may <b>Explore</b> the alley once and <b>Seek an Encounter</b> at the cantina once. Each world has its own characters.</li><li>A bigger fuel tank starts empty. Stuck without the fuel for any jump? A tug will drag you to a fuel dock, for a fee.</li></ul>' +
  '<h4>Odd jobs</h4><p>Each world has one action mini-game, playable once per visit. Your rating (Flop, Bronze, Silver, Gold) sets a small payout that grows with your wealth. Gold also earns a point of reputation. It is pocket money, not a business plan.</p>' +
  '<h4>Facilities</h4><p>About 1 trip in 5 brings an offer to buy a facility on the world you reach. It stands while you are docked, so sell cargo first if you need the money. Brokers improve trades, depots cut fuel costs, and factories, warehouses and hotels collect fees from rivals. A facility costs about 20 times the benefit it brings per jump, and owning one raises your reputation.</p>' +
  '<h4>Bank</h4><p>Deposits earn 3% and loans cost 5%. Interest is added every 4 jumps. You can take a loan of 1,000c at a time.</p>' +
  '<h4>Rivals</h4><p>Four rival traders roam the map. When you share a world with one, you may get to <b>Sabotage</b> (a sneaky mini-game), <b>Assist</b> or <b>Ignore</b> them.</p>' +
  '<h4>Gambling</h4><p>One world runs a strange parlour. Nobody explains the rules, and the odds are only described in words. The house keeps an edge in the long run.</p>' +
  '<h4>Speed</h4><p>Your ship\'s <b>warp speed</b> does four jobs. <b>Fuel:</b> every jump burns less fuel, in proportion to the square root of speed. <b>Dodging:</b> each 0.1 of warp above 0.9 gives a 2.5% chance to outrun a bad event on the road (up to 45%). <b>Turn order:</b> in a shared game the fastest ship moves first each round, so it gets the first pick of the markets. <b>Getaway:</b> quick ships sabotage rivals more cleanly. Engine damage cuts warp for a few jumps, and the Warp Engine upgrade adds 0.2.</p>' +
  '<h4>Day and Night</h4><p>Each time you land, the sun is either up or down. It is only for atmosphere. SND turns the beeps on or off.</p>' +
  '<h4>Two to four captains</h4><p>Captains take turns in rounds on one shared device. Everyone trades the same markets, so one captain\'s big sale moves the price for the next. A round is one visit and one jump for each captain, fastest ship first. Only one captain can own the facility on any given world. When someone reaches the target, the round finishes, and the richest captain wins. A captain who runs out of credits and cargo is out of the race.</p>' +
  '<div class="row" style="justify-content:flex-end"><button class="btn" data-act="close">Got it</button></div>'; }

/* Galactic Trader Deluxe. Part 17: the flight transition. Warp tunnel, ship's computer chatter, the trouble on the way, and the landing card. */
var FL = { raf: 0, n: 0 };
FL.QUIPS = ['Reticulating splines...', 'Asking the engine nicely...', 'Playing elevator music at the void...', 'The autopilot says it knows a shortcut. It does not.', 'Please keep your arms inside the ship and your hopes low.', 'Calculating the exact cost of this fuel. Do not look.', 'Warp factor "probably fine" engaged.', 'Something is rattling. It was rattling yesterday too.', 'Feeding the ship a snack. She gets cranky.', 'Space is mostly empty. So is your hold. Soon, not.', 'Warp lines: now with 30% more lines.', 'Navigation says "left, then more left". We are going right.'];
FL.HEADS = ['MEANWHILE, IN DEEP SPACE...', 'UH OH.', 'WELL, THAT HAPPENED.', 'LOOK OUT!', 'PLOT TWIST!', 'SPACE INCIDENT!'];

FL.ball = function (p) {
  var B = new PX.Buf(64, 64, 255); PX.ball(B, 32, 32, p.ring ? 17 : 26, p.id, p.type, p.ring);
  return '<img class="pxi ball" src="' + PX.url('flball/' + p.id, B, false) + '" width="64" height="64" alt="">';
};

FL.card = function (head, body, label, act, cls) { return '<div class="fcard panel ' + (cls || '') + '"><h2 class="hd" style="font-size:36px">' + head + '</h2>' + body + '<div class="acts" style="margin-top:12px;justify-content:flex-end"><button class="btn big pink" data-act="' + act + '">' + label + '</button></div></div>'; };

/* entries: the log lines the jump created, oldest first. done() runs when the player docks. */
FL.run = function (from, to, entries, done) {
  var el = $('flight'), P = GT.PLANETS, A = P[from], B = P[to], DUR = 5400, t0 = 0, phase = 'warp', last = 0, W = 0, H = 0, dpr = 1 / 3, stars = [], rnd = GT.seeded(Date.now() & 0xffff), k;
  var mid = [], post = [], seenArr = false;
  entries.forEach(function (e, i) { var tx = plainText(e.text); if (/^Arrived/.test(tx)) { seenArr = true; return; } if (seenArr) post.push(e); else if (!/^Departed/.test(tx)) mid.push(e); });
  var lines = ['Departed ' + A.name + '. Bound for ' + B.name + '.'];
  var qs = FL.QUIPS.slice().sort(function () { return GT.rand() - 0.5; }); lines.push(qs[0], qs[1], mid.length ? 'Wait. What was that?' : qs[2], 'Approaching ' + B.name + '...');
  var sh = GT.SHIPS.filter(function (x) { return x.id === S.shipId; })[0];
  el.innerHTML = '<canvas class="stars"></canvas><div class="top">WARP TO ' + esc(B.name.toUpperCase()) + '</div><div class="pl" id="fl-a" style="width:300px">' + FL.ball(A) + '</div><div class="pl" id="fl-b" style="width:300px;opacity:0">' + FL.ball(B) + '</div><div class="fship">' + UI.shipPic(sh.id, sh.hue, 64, 40, 4) + '</div><div class="cap" id="fl-cap"><div class="ticker" id="fl-tick"></div><div class="prog"><i id="fl-prog"></i></div><div style="font-size:12px;opacity:.7;margin-top:4px">Click to skip</div></div><div id="fl-card"></div>';
  el.hidden = false; $('toast').hidden = true; $('stage').setAttribute('aria-hidden', 'true');
  var cv = el.querySelector('canvas'), cx = cv.getContext('2d'), pa = $('fl-a'), pb = $('fl-b'), tick = $('fl-tick'), prog = $('fl-prog');
  function size() { W = el.clientWidth; H = el.clientHeight; cv.width = W * dpr; cv.height = H * dpr; cx.setTransform(dpr, 0, 0, dpr, 0, 0); }
  size();
  for (k = 0; k < 260; k++) stars.push({ a: rnd() * 6.283, r: rnd() * Math.max(W, H) * 0.7, c: ['#ffffff', '#55ffff', '#ff55ff', '#ffff55'][Math.floor(rnd() * 4)], z: 0.4 + rnd() * 1.1 });
  function ease(x) { x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); }
  function lerp(a, b, x) { return a + (b - a) * x; }
  SFX.play('warp');
  var shown = -1, typed = 0;
  function frame(now) {
    if (phase !== 'warp') return;
    if (!t0) { t0 = now; last = now; } var t = Math.min(now - t0, DUR), dt = Math.min(0.05, (now - last) / 1000); last = now;
    var v = t < 1300 ? lerp(60, 1700, ease(t / 1300)) : t < 3900 ? 1700 : lerp(1700, 80, ease((t - 3900) / 1500));
    cx.fillStyle = '#000'; cx.fillRect(0, 0, W, H); var mx = W / 2, my = H / 2, lim = Math.hypot(W, H) * 0.55;
    stars.forEach(function (s) { var r0 = s.r; s.r += v * s.z * dt * (0.25 + s.r / 420); if (s.r > lim) { s.r = 6 + Math.random() * 40; s.a = Math.random() * 6.283; r0 = s.r; } var len = Math.max(1, v * s.z * 0.012 * (0.4 + s.r / 300)); cx.strokeStyle = s.c; cx.lineWidth = 3 * (1 + Math.floor(s.r / 220)); cx.beginPath(); cx.moveTo(mx + Math.cos(s.a) * (s.r - len), my + Math.sin(s.a) * (s.r - len) * 0.9); cx.lineTo(mx + Math.cos(s.a) * s.r, my + Math.sin(s.a) * s.r * 0.9); cx.stroke(); });
    PX.snap(cx, cv.width, cv.height);

    function place(e, x, y, s) { e.style.transform = 'translate(' + (x - 150) + 'px,' + (y - 127) + 'px) scale(' + s + ')'; }
    pa.style.opacity = String(t < 1500 ? 1 - a * 0.2 : 0); place(pa, lerp(W * 0.25, W * 0.04, a), lerp(H * 0.58, H * 0.32, a), lerp(1.4 * base, 0.08 * base, a));
    pb.style.opacity = String(t > 3500 ? 1 : 0); place(pb, lerp(W * 0.74, W * 0.72, b), lerp(H * 0.4, H * 0.42, b), lerp(0.03 * base, 1.0 * base, b));

    typed += 1.1; tick.textContent = lines[li].slice(0, Math.floor(typed));

  }

    mid.forEach(function (e) { body += '<div class="le ' + e.kind + '" style="font-size:15px;margin-top:6px">' + e.text + '</div>'; if (e.kind === 'loss') worst = 'loss'; else if (e.kind === 'gain' && worst !== 'loss') worst = 'gain'; });
    SFX.play(worst === 'loss' ? 'bad' : worst === 'gain' ? 'win' : 'pop');
    $('fl-card').innerHTML = FL.card(GT.pick(FL.HEADS), body, 'Carry on', 'fl-next');
  }
  function arrCard() {
    phase = 'arrive'; cancelAnimationFrame(FL.raf); $('fl-cap').hidden = true; pa.style.opacity = '0'; pb.style.opacity = '0'; cx.clearRect(0, 0, W, H);
    var extra = ''; post.forEach(function (e) { extra += '<div class="le ' + e.kind + '" style="font-size:13px;margin-top:4px">' + e.text + '</div>'; });
    $('fl-card').innerHTML = FL.card('WELCOME TO ' + esc(B.name.toUpperCase()), '<canvas id="fl-pic" style="width:100%;border:4px solid var(--ink);border-radius:12px;display:block"></canvas><div class="dim" style="margin:6px 0 0;font-size:13px">' + B.type + ' &middot; say it: ' + esc(B.say) + '</div>' + extra, 'Dock', 'fl-dock', 'arrive');
    var pic = $('fl-pic'); if (pic) UI.drawPlanet(pic, B); SFX.play('coin');
  }
  function arrive() { if (mid.length) evCard(); else arrCard(); }
  el.onclick = function (e) {
    var a = e.target.closest('[data-act]');

};

/* Galactic Trader Deluxe. Part 18: mini-game framework and the first four games. Every game has a score, three goals (Bronze, Silver, Gold) and a time limit. */
var MG = { games: {}, W: 640, H: 400, raf: 0, state: '', G: null, g: null, inp: null, cb: null, cv: null, cx: null };
MG.INK = '#1d0f33';
MG.T = function (c, s, x, y, size, fill, al) { c.font = size + 'px Bangers, Impact, sans-serif'; c.textAlign = al || 'center'; c.textBaseline = 'middle'; c.lineJoin = 'round'; c.lineWidth = Math.max(3, size / 6); c.strokeStyle = MG.INK; c.strokeText(s, x, y); c.fillStyle = fill || '#fff3cf'; c.fillText(s, x, y); };
MG.rect = function (c, x, y, w, h, fill, r, lw) { c.beginPath(); if (c.roundRect) c.roundRect(x, y, w, h, r || 0); else c.rect(x, y, w, h); c.fillStyle = fill; c.fill(); c.lineWidth = lw || 4; c.strokeStyle = MG.INK; c.lineJoin = 'round'; c.stroke(); };

MG.poly = function (c, pts, fill) { c.beginPath(); pts.forEach(function (p, i) { i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1]); }); c.closePath(); c.fillStyle = fill; c.fill(); c.lineWidth = 4; c.strokeStyle = MG.INK; c.lineJoin = 'round'; c.stroke(); };
MG.eyes = function (c, x, y, d, r) { MG.ball(c, x - d, y, r, '#fff', 2.5); MG.ball(c, x + d, y, r, '#fff', 2.5); MG.ball(c, x - d + 1, y + 1, r * 0.45, MG.INK, 1); MG.ball(c, x + d + 1, y + 1, r * 0.45, MG.INK, 1); };
MG.float = function (G, x, y, txt, col) { G.fx.push({ x: x, y: y, t: 0, txt: txt, col: col || '#ffe14a' }); };

/* the runner: card, countdown, loop, result card */

    MG.T(c, 'STREAK ' + G.streak, 90, 380, 22, '#fff3cf');
  };

  /* ---- 7. GATE GLIDER: flappy rocket through warp gates ---- */
  G_.cloud.draw = function (c, G) {
    c.fillStyle = '#16083a'; c.fillRect(0, 0, 640, 400); stars(c, G, 8, 50, 70, 'x');
    planet(c, 520 - (G.t * 8) % 60, 320, 70, '#d8763a'); c.strokeStyle = 'rgba(0,0,0,.35)'; c.lineWidth = 6; c.beginPath(); c.ellipse(520 - (G.t * 8) % 60, 320, 70, 14, 0, 0, 7); c.stroke();
    G.obj.forEach(function (o) {
      if (o.k === 'ring') { c.strokeStyle = MG.INK; c.lineWidth = 14; c.beginPath(); c.ellipse(o.x, o.y, 14, 36, 0, 0, 7); c.stroke(); c.strokeStyle = '#ffe14a'; c.lineWidth = 7; c.beginPath(); c.ellipse(o.x, o.y, 14, 36, 0, 0, 7); c.stroke(); c.strokeStyle = 'rgba(88,255,255,.5)'; c.lineWidth = 3; c.beginPath(); c.ellipse(o.x, o.y, 5, 24, 0, 0, 7); c.stroke(); }
      else { rock(c, o.x - 16, o.y + 8, 20, '#7a6a8a', '#5a4a6a'); rock(c, o.x + 14, o.y + 6, 24, '#6a5a7a', '#4a3a5a'); rock(c, o.x, o.y - 14, 22, '#8a7a9a', '#6a5a7a'); }
    });
    var fl = G.inv > 0 && Math.floor(G.t * 14) % 2; if (!fl) { c.save(); c.translate(120, G.y); c.rotate(G.vy / 700); MG.poly(c, [[-34, -6], [-22, 0], [-34, 6]], '#ff8a1f'); MG.poly(c, [[-26, -4], [-4, -18], [30, 0], [-4, 18], [-26, 4]], '#ff3d8b'); MG.poly(c, [[-10, -8], [-22, -24], [-2, -14]], '#4fd2ff'); MG.poly(c, [[-10, 8], [-22, 24], [-2, 14]], '#4fd2ff'); MG.ball(c, 8, 0, 7, '#bff4ff', 2.5); c.restore(); }
    for (var h = 0; h < 3; h++) MG.ball(c, 26 + h * 30, 26, 11, h < G.lives ? '#ff3d8b' : '#a98bff');
    if (G.combo > 1) MG.T(c, 'GATE STREAK ' + G.combo, 520, 26, 24, '#fff3cf');
  };

  /* ---- Dock Sneak keeps its logic; the guard becomes an alien dock guard ---- */
  var sneakDraw = G_.sneak.draw;
  G_.sneak.draw = function (c, G) {
    sneakDraw(c, G);
    var gx = 180 + G.gx; c.fillStyle = '#58ff9a'; c.beginPath(); c.arc(gx, 168, 27, 0, 7); c.fill(); c.lineWidth = 3; c.strokeStyle = MG.INK; c.stroke();
    if (G.face) { MG.eyes(c, gx, 166, 11, 9); } else { c.fillStyle = '#3a8a5a'; c.beginPath(); c.arc(gx, 168, 27, 0, 7); c.fill(); c.stroke(); c.fillStyle = '#6a4a2a'; c.beginPath(); c.arc(gx, 168, 28, Math.PI, 7); c.fill(); c.stroke(); if (G.warn) MG.T(c, '?', gx, 108, 44, '#ffe14a'); }
    c.strokeStyle = MG.INK; c.lineWidth = 3; c.beginPath(); c.moveTo(gx - 10, 142); c.lineTo(gx - 18, 118); c.moveTo(gx + 10, 142); c.lineTo(gx + 18, 118); c.stroke(); MG.ball(c, gx - 18, 116, 5, '#ffe14a', 2); MG.ball(c, gx + 18, 116, 5, '#ffe14a', 2);
  };
})();

/* Galactic Trader Deluxe. Part 20: actions, hotspots, events and boot. */
function syncBar() { var s = $('bSound'); if (s) s.textContent = SFX.on ? 'SND' : 'MUTE'; }
function settle() {
  if (G && G.over && !ui.endShown) { ui.endShown = true; SFX.play(G.over.won ? 'win' : 'lose'); endModal(); }
  else if (S && !S.over && S.pending && $('modal').hidden && $('mg').hidden && $('flight').hidden && $('pass').hidden) compModal();
}
function sfxFor(kind) { SFX.play(kind === 'gain' ? 'win' : kind === 'loss' ? 'bad' : 'pop'); }
function lastEntry(top) { var n = newLogs(top); return n.length ? n[n.length - 1] : null; }

/* walk the captain to a door, then open the place */
var HS_PAGE = { market: 'market', bank: 'bank', yard: 'yard', fuel: 'fuel', cantina: 'cantina', alley: 'alley', office: 'office', parlour: 'parlour', exchange: 'exchange', jobs: 'jobs', pad: 'pad' };
function walkTo(kind, done) {
  var pl = $('player'), d = SC.door && SC.door[kind], from = ui.px && ui.px.x != null ? ui.px : (SC.door && SC.door.pad);
  if (!pl || !d || !from || reduced()) { if (d) ui.px = { x: d.x, y: d.y, s: d.s }; ui.walking = false; done(); return; }
  var dist = Math.hypot(d.x - from.x, d.y - from.y), dur = Math.max(0.3, Math.min(1.1, dist / 170)); ui.px = { x: d.x, y: d.y, s: d.s }; ui.walking = true;
  pl.style.transitionDuration = dur + 's'; pl.classList.add('walking'); pl.style.transform = 'translate(' + d.x + 'px,' + d.y + 'px) scale(' + Math.max(0.3, Math.min(1, d.s)).toFixed(2) + ')';
  setTimeout(function () { ui.walking = false; done(); }, dur * 1000 + 80);
}
function hotspot(el) {
  if (ui.walking || !S || S.over) return; var kind = el.dataset.hs;
  if (el.classList.contains('closed')) { var role = kind === 'yard' ? 'yard' : 'fuel'; var c = castOf(role), pid = plan().id; toast((c ? c.name + ': ' : '') + '"' + NP.say(role, 'closed') + '"'); SFX.play('bad'); return; }
  setSentence('Walking to ' + el.dataset.label.replace(/^(Go to|Poke around|Check|Visit|Enter) (the )?/i, '') + '...'); SFX.play('click');
  walkTo(kind, function () { go(HS_PAGE[kind]); });
}

/* a jump: the engine does the work, then the warp screen replays what happened */
function doJump(to, towed) {
  var from = S.loc, top = S.log[0], jumper = S, ok = towed ? GT.tow(S) : GT.jump(S, to); if (!ok) return;
  $('toast').hidden = true;
  var entries = newLogs(top); ui.dep = ui.wd = ui.rep = 0; ui.dest = null; ui.more = 0; ui.px = null; ui.page = 'hub'; ui.last = null; ui.lastPage = null; render();
  FL.run(from, S.loc, entries, function () { afterJump(jumper); });
}
/* the jump is over: close the turn, then show the end screen, the next captain, or the same captain's next visit */
function resetTurnUI() { ui.dest = null; ui.qty = {}; ui.dep = ui.wd = ui.rep = 0; ui.more = 0; ui.px = null; ui.page = 'hub'; ui.last = null; ui.lastPage = null; ui.scroll = {}; ui.say = {}; }
function afterJump(p) {
  var next = function () {
    var over = GT.endTurn(G);
    if (over) { render(); settle(); return; }
    S = GT.active(G); resetTurnUI();
    if (G.multi) { passScreen(); render(); } else { render(); settle(); }
  };
  if (G.multi && p.over) {
    if (p.over.won) notice('<h2 class="win">' + esc(p.name) + ' reaches ' + fmt(G.target) + 'c!</h2><p>The race is not over yet. The round finishes so everyone gets an equal number of turns, then the richest captain wins.</p>', next);
    else notice('<h2 class="lose">' + esc(p.name) + ' is ruined!</h2><p>' + esc(p.over.why) + ' ' + esc(p.name) + ' is out of the race. Everyone else carries on.</p>', next);
  } else next();
}

function startGame() {
  var st = ui.setup, list = [], seen = {}, k;
  for (k = 0; k < st.n; k++) { var p = st.p[k], nm = (p.name || '').trim() || 'Captain ' + (k + 1); if (seen[nm.toLowerCase()]) nm = nm.slice(0, 17) + ' ' + (k + 1); seen[nm.toLowerCase()] = 1; list.push({ name: nm, shipId: p.ship, char: CH.fromName(nm, p.salt) }); }
  G = GT.newGame(list, { target: st.target }); S = GT.active(G); resetTurnUI(); ui.endShown = false; ui.afterNotice = null;
  Object.keys(ui).forEach(function (k2) { if (k2.indexOf('seen-') === 0) delete ui[k2]; });
  G.players.forEach(function (q) {
    var sh = GT.SHIPS.filter(function (x) { return x.id === q.shipId; })[0];
    GT.log(q, 'Welcome aboard, <b>' + esc(q.name) + '</b>, ' + esc(q.char.title) + '. You start at <b>' + GT.PLANETS[q.loc].name + '</b> with ' + fmt(q.credits) + 'c and a ' + esc(sh.name) + '. Reach ' + fmt(GT.CFG.WIN) + 'c to win.', 'info');
    GT.log(q, 'Tip: goods are cheap where they are made. Read each world\'s description, find a far world on the Launch Pad map, and sell where it is scarce.', 'info');
  });
  $('start').hidden = true; closeModal(); $('pass').hidden = true;
  if (G.multi) { passScreen(); render(); } else { render(); toast('Click a building to walk there and visit it.'); }
}

/* Extension points for the v4 parts (gt-34-pages2.js, gt-35-port.js). A handler gets the action name and the clicked element, and returns true once it has dealt with it
   (the app then re-renders). INPX handlers see every input event and return true when they dealt with it. KEYX handlers are for keys. */
function actExt(a, el) { for (var k = 0; k < ACTX.length; k++) if (ACTX[k](a, el)) return true; return false; }

function act(a, el) {
  if (a.indexOf('pick-') === 0) { sp().ship = a.slice(5); Array.prototype.forEach.call(document.querySelectorAll('.ship'), function (b) { b.setAttribute('aria-pressed', String(b.dataset.act === a)); }); refreshCap(); return; }
  if (a === 'reroll') { sp().salt++; refreshCap(); SFX.play('pop'); return; }
  if (a === 'randname') { sp().name = GT.pick(SILLY); $('in-name').value = sp().name; sp().salt = 0; refreshCap(); SFX.play('pop'); return; }
  if (a.indexOf('players-') === 0) { ui.setup.n = +a.slice(8); if (ui.setup.cur >= ui.setup.n) ui.setup.cur = ui.setup.n - 1; renderStart(); return; }
  if (a.indexOf('target-') === 0) { ui.setup.target = +a.slice(7); renderStart(); return; }
  if (a.indexOf('cap-') === 0) { ui.setup.cur = +a.slice(4); renderStart(); return; }
  if (a === 'tag') { var tg = $('tagline'); ui.tag = tagline(); if (tg) tg.innerHTML = '&ldquo;' + esc(ui.tag) + '&rdquo;'; SFX.play('pop'); return; }
  if (a === 'launch') { startGame(); return; }
  if (a === 'pass-ok') { $('pass').hidden = true; render(); settle(); return; }
  if (a === 'notice-ok') { closeModal(); var nf = ui.afterNotice; ui.afterNotice = null; if (nf) nf(); return; }
  if (a.indexOf('endp-') === 0) { endModal(+a.slice(5)); return; }
  if (a === 'close') { closeModal(); return; }
  if (a === 'info') { openModal(infoHTML(), true); return; }
  if (a === 'sound') { SFX.on = !SFX.on; try { localStorage.setItem('gt-snd', SFX.on ? '1' : '0'); } catch (e) {} syncBar(); SFX.play('pop'); return; }
  if (a === 'new') { if (!S || (G && G.over) || el.dataset.sure) { S = null; G = null; ui.tag = null; closeModal(); $('pass').hidden = true; $('flight').hidden = true; renderStart(); } else openModal('<h2>Abandon this voyage?</h2><p>Your current game will be lost.</p><div class="row" style="justify-content:flex-end"><button class="btn blue" data-act="close">Keep playing</button><button class="btn pink" data-act="new" data-sure="1">Abandon</button></div>'); return; }
  if (!S) return;
  if (a === 'log') { logModal(); return; }
  if (a === 'more') { ui.more += 60; logModal(); return; }
  if (a === 'leave') { go('hub'); return; }
  if (a === 'go-ship') { go('ship'); return; }
  if (a.indexOf('comp-') === 0) { compAct(a.slice(5)); return; }
  if (S.over) return;
  if (actExt(a, el)) { render(); settle(); return; }
  var row = el && el.closest ? el.closest('.mk-row') : null, i = row ? +row.dataset.i : -1, q, top = S.log[0], nm;
  if (a === 'buy' || a === 'max') { q = GT.buy(S, i, a === 'max' ? GT.maxBuy(S, i) : qtyOf(i)); if (q) { speak('market', NP.say('market', 'buy', { qty: q.qty, item: GT.ITEMS[i].name })); SFX.play('buy'); } }
  else if (a === 'sell' || a === 'all') { q = GT.sell(S, i, a === 'all' ? S.cargo[i].qty : qtyOf(i)); if (q) { speak('market', NP.say('market', 'sell', { qty: q.qty, item: GT.ITEMS[i].name })); SFX.play('sell'); } }
  else if (a === 'deposit') { var n1 = ui.dep; if (GT.deposit(S, n1)) { speak('bank', NP.say('bank', 'deposit', { amt: fmt(n1) })); SFX.play('coin'); } ui.dep = 0; }
  else if (a === 'withdraw') { var n2 = ui.wd; if (GT.withdraw(S, n2)) { speak('bank', NP.say('bank', 'withdraw', { amt: fmt(n2) })); SFX.play('coin'); } ui.wd = 0; }
  else if (a === 'loan') { if (GT.takeLoan(S)) { speak('bank', NP.say('bank', 'loan')); SFX.play('coin'); } }
  else if (a === 'repay') { var n3 = Math.floor(Math.min(ui.rep, S.loan, S.credits)); if (GT.repay(S, ui.rep)) { speak('bank', NP.say('bank', 'repay', { amt: fmt(n3) })); SFX.play('coin'); } ui.rep = 0; }
  else if (a.indexOf('up-') === 0) { var k = a.slice(3), lv = S.ship.lv[k]; GT.upgrade(S, k); if (S.ship.lv[k] > lv) { speak('yard', NP.say('yard', 'upgrade')); SFX.play('win'); } }
  else if (a === 'ref10' || a === 'refall') { if (GT.refuel(S, a === 'ref10' ? 10 : 9999)) { speak('fuel', NP.say('fuel', 'refuel')); SFX.play('buy'); } }
  else if (a === 'encounter' || a === 'explore') {
    if (GT[a](S)) { var e = lastEntry(top); ui.last = { key: a, loc: S.loc, turn: S.turn, kind: e.kind, text: e.text }; sfxFor(e.kind); var role = a === 'encounter' ? 'cantina' : 'alley'; speak(role, GT.pick(a === 'encounter' ? ['Pull up a stool. I have a story, and it is mostly true.', '*slides into the booth*', 'You bought the round, so I will bore you for free.'] : ['You peer into the dark and something peers back.', 'You poke around. The alley pokes around you.', 'It smells. That is how you know it is working.'])); }
  }
  else if (a === 'facility') { if (GT.buyFacility(S)) { speak('office', NP.say('office', 'bought')); SFX.play('win'); } }
  else if (a === 'sit') { gambleModal(null); return; }
  else if (a.indexOf('gamble-') === 0) { var pr = a.split('-'), res = GT.gamble(S, +pr[1], +pr[2]); if (res) { SFX.play(res.net > 0 ? 'win' : res.net < 0 ? 'bad' : 'pop'); gambleModal(res); render(); settle(); } return; }
  else if (a === 'job-start') { if (GT.jobAvailable(S)) startJob(); return; }
  else if (a === 'jump') { doJump(ui.dest, false); return; }
  else if (a === 'tow') { doJump(GT.towTarget(S), true); return; }
  render(); settle();
}

function startJob() {
  var j = GT.job(S);
  MG.run(j.id, function (res) {
    if (res.quit) { render(); return; }
    var top = S.log[0], r = GT.jobFinish(S, res.rating, res.score); speak('jobs', res.rating === 3 ? 'Gold! Foreman Gruff almost smiles. It looks painful.' : res.rating === 0 ? 'Well. You turned up. That counts for something. Not money, though.' : 'Fine work. Here is your pay, and a pat on the back I will not give.');
    toast(r.money ? 'Job done: +' + fmt(r.money) + 'c' + (r.rep ? ' and +1 reputation' : '') : 'Job done, no pay.'); sfxFor(r.money ? 'gain' : 'info'); render(); settle();
  });
}
function compAct(kind) {
  closeModal();
  var finish = function (perf) {
    var top = S.log[0]; GT.compAction(S, kind, perf); var e = lastEntry(top); render();
    if (e) openModal('<h2>' + (kind === 'sabotage' ? 'Sabotage!' : kind === 'assist' ? 'A helping hand' : 'You move along') + '</h2><div class="le ' + e.kind + '" style="font-size:15px">' + e.text + '</div><div class="row" style="justify-content:flex-end"><button class="btn pink" data-act="close">Onward</button></div>');
    sfxFor(e ? e.kind : 'info'); settle();
  };
  if (kind === 'sabotage') MG.run('sneak', function (res) { finish(res.quit ? 0 : res.perf); }, { startLabel: 'Sneak in!' });
  else finish();
}

/* ---------- events ---------- */
document.addEventListener('click', function (e) {
  if (e.target.closest('#mg') || e.target.closest('#flight')) return;
  var pl = e.target.closest('#stage .pl');
  if (pl && S && !S.over) { var i = +pl.dataset.i; ui.dest = i === S.loc || ui.dest === i ? null : i; SFX.play('click'); render(); return; }
  var hs = e.target.closest('#stage .hs'); if (hs && S) { hotspot(hs); return; }
  var el = e.target.closest('[data-act]'); if (el && !el.disabled) { SFX.play('click'); act(el.dataset.act, el); }
});
document.addEventListener('contextmenu', function (e) { var hs = e.target.closest('#stage .hs'); if (hs && S) { e.preventDefault(); toast(hs.classList.contains('closed') ? NP.QUIP.closed : NP.QUIP[hs.dataset.hs] || 'Nothing special.'); } });
document.addEventListener('mouseover', function (e) { var t = e.target.closest ? e.target.closest('[data-label]') : null; if (t && ($('stage').contains(t) || t.closest('#bar'))) setSentence(t.dataset.label); });
document.addEventListener('mouseout', function (e) { var t = e.target.closest ? e.target.closest('[data-label]') : null; if (t && S) { var nx = e.relatedTarget && e.relatedTarget.closest ? e.relatedTarget.closest('[data-label]') : null; if (!nx) setSentence(ui.defSentence || ''); } });
document.addEventListener('keydown', function (e) {
  if (!$('mg').hidden || !$('flight').hidden) return;
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('hs') && S) { e.preventDefault(); hotspot(e.target); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('pl') && S && !S.over) { e.preventDefault(); var i = +e.target.dataset.i; ui.dest = i === S.loc || ui.dest === i ? null : i; render(); return; }
  if (e.key === 'Escape') { if (!$('pass').hidden) return; if (!$('modal').hidden) { if (!(S && S.pending)) closeModal(); } else if (S && ui.page !== 'hub' && $('start').hidden) go('hub'); }
});
function setDis(sel, ok) { var b = document.querySelector(sel); if (b) b.disabled = !ok || !!(S && S.over); }
document.addEventListener('input', function (e) {
  var t = e.target; if (t.id === 'in-name') { sp().name = t.value; sp().salt = 0; refreshCap(); return; } if (!S) return;
  var v = Math.max(0, Math.floor(+t.value || 0));
  for (var xi = 0; xi < INPX.length; xi++) if (INPX[xi](t, v)) return;
  if (t.classList.contains('qty')) { var row = t.closest('.mk-row'), i = +row.dataset.i; ui.qty[i] = Math.max(1, v); row.querySelector('[data-act="buy"]').disabled = !GT.canBuy(S, i, ui.qty[i]) || !!S.over; row.querySelector('[data-act="sell"]').disabled = !GT.canSell(S, i, ui.qty[i]) || !!S.over; }
  else if (t.id === 'in-dep') { ui.dep = v; setDis('[data-act="deposit"]', v > 0 && v <= S.credits); }
  else if (t.id === 'in-wd') { ui.wd = v; setDis('[data-act="withdraw"]', v > 0 && v <= S.bank); }
  else if (t.id === 'in-rep') { ui.rep = v; setDis('[data-act="repay"]', v > 0 && S.loan > 0 && S.credits > 0); }
});

/* ---------- boot ---------- */
/* the fixed retro frame: scale the 1280 x 800 stage to fit the window; phones and other narrow windows get the fluid layout */
function fitFrame() {
  var f = $('frame'), w = window.innerWidth, h = window.innerHeight; if (!f) return;
  var fluid = w < 860 || h < 520 || w / h < 1.05;
  f.classList.toggle('fluid', fluid);
  f.style.setProperty('--k', fluid ? 1 : (Math.min(w / 1280, h / 800)).toFixed(4));
}
window.addEventListener('resize', fitFrame);

(function () {
  try { var sd = localStorage.getItem('gt-snd'); if (sd === '0') SFX.on = false; } catch (e) {}
  fitFrame(); syncBar(); setupInit(); renderStart(); CR.start();
})();

</script>
